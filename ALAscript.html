</div>

    "cost_expensive": "1-нұсқа\n\nТүсінемін, {Имя клиента}, қазір қиын кезеңде бәрі ақшасын есеппен жұмсауға тырысады. Бірақ ең бастысы — денсаулық пен күш-қуат, солай емес пе? (жауап күтеміз) Айырмашылықты Сіз алғашқы күндерден-ақ байқайсыз: күш пайда болады, қуат артады, ұйқы түзеледі, ағза іштен қауіпсіз түрде қалпына келе бастайды. Ең маңыздысы — нәтиже ұзаққа бекітіледі, сондықтан симптомды ғана жасыратын химиялық дәрілерді қайта-қайта іздеп жүрмейсіз.\n\nЖеңілдік бағдарламасының арқасында Сіз ағзаны қалпына келтіруге және нығайтуға көмектесетін құралды шартты түрде шағын төлеммен ала аласыз, өйткені негізгі соманың көп бөлігін біз жабамыз, ал Сізден аз ғана үстеме төлем қалады.\n\n{Имя клиента}, тапсырысты рәсімдейміз бе?\n\n2-нұсқа\n\n{Имя клиента}, Сізді толық түсінемін, баға әрқашан маңызды. Бірақ денсаулық жайлы сөз болғанда, тауардың өзі емес, нәтижесі маңыздырақ: хал-жағдай жақсарсын, жеңілдік сезімі, қуат пен сенімділік қайтсын. Жақсы құралдың тым арзан болмайтынын өзіңіз де түсінесіз ғой. Егер оны дәріханадағы жаппай сатылатын өнімдермен салыстырсақ, біздің баға жоғарырақ көрінуі мүмкін. Бірақ ол жақта Сіз көбіне синтетикалық қоспаларға, агрессивті консерванттарға және бренд үшін маркетингтік үстемеге ақша төлейсіз. Ал біз таза құрамға және дәлелденген тиімділікке басымдық береміз. Бұл органикалық өнімді фастфудтан таңдағанмен бірдей — сапа айырмашылығы бірден білінеді.\n\nҚазір Сізде жеңілдікті пайдаланып, шынымен (клиенттің мәселесін атаңыз) қалпына келтіруге көмектесетін курсты алу мүмкіндігі бар. Таза үнеміңіз 12 000 теңгеден асады!\n\n{Имя клиента}, тапсырысты рәсімдеп, қалпына келуді бастаймыз ба?\n\n3-нұсқа\n\n{Имя клиента}, Сіз денсаулықты қалпына келтіру мен қолдауға арналған жеңілдік бағдарламасын пайдалана аласыз. Осындай кешендер дәріханаларда 56–80 мың теңге аралығында тұрады, бізде стандартты баға — 90 000 теңге, ал Сіздің жеңілдікпен бар болғаны 37 000 теңге шығады. Оның үстіне жеткізу тегін, алдын ала төлем жоқ, төлем тек алған кезде жасалады. Бұған қоса, жақын арада бағаның өсуі күтілуде.",
    "cost_no_extra_pay": "Ертеңін ойлайтын адамдар денсаулықтан үнемдеудің тиімсіз екенін жақсы түсінеді. Біз өндіріспен тікелей жұмыс істейміз, тек премиум концентратпен жұмыс жасаймыз, қолдан жасалған немесе сапасыз тауармен айналыспаймыз. Сондықтан тапсырыс берген кезде Сіз расымен де сапалы премиум құрал алатыныңызға сенімді бола аласыз — бұл Сіз үшін сапа кепілі болады. Маған сеніңіз, дәл осындай сомаға мұндай сападағы өнімді басқа жерден табу қиын. Мұндай жеңілдік бағдарламасы екінің біріне түсе бермейді, осындай мүмкіндікті неге жіберіп алу керек? Бұл құралдың жеке өзіңізге қандай пайда әкелетінін көз алдыңызға елестетіп көріңіз.\n\nДеректерді растаған сәттен бастап бірнеше күннің ішінде құрал қолыңызда болады да, Сіз курсты бастайсыз. Менің барлық клиенттерім нәтижесіне риза болған, Сіз де риза боласыз, бұған күмәнданбаңыз. {Имя клиента}, тапсырысты қай мекенжайға рәсімдейміз?",
    "cost_loans": "{Имя клиента}, қазір қаржы жағынан қиын болуы мүмкін екенін мен жақсы түсінемін. Бірақ келісесіз ғой, несиені адамдар 20–30 жыл төлейді, алайда сол жылдардың бәрінде өзіне қажет дүниеден бас тартпайды. Оның үстіне, тапсырыс Сізге жеткенше, төлемге дайындалып алуға уақытыңыз болады. Мұндай мүмкіндік өмірде бір-ақ рет түсуі мүмкін: өте қымбат құралды осындай жеңілдікпен алып, ең бастысы — күткен нәтижеге қол жеткізу.\n\nНе дейсіз, рәсімдейміз бе?",
    "cost_pharmacy": "1-нұсқа\n\n{Имя клиента}, әрине, бұл — Сіздің таңдауыңыз, және мұндай шешімді тек өзіңіз қабылдайсыз. Бірақ қазіргі заманда денсаулықты қолдауға арналған құрал түрі өте көп, әр адам өзіне лайық нұсқаны таба алады. Біздің елде, жалпы алғанда, дәрі-дәрмек тапшылығы жоқ. Дәріханада кез келген ауруға арналған дәрі бар. Бірақ соған қарамастан, дәріхана сөрелері толып тұрса да, дені сау адамдар көбейіп кеткен жоқ.\n\n2-нұсқа\n\n{Имя клиента}, бұл расында Сіздің таңдауыңыз. Дегенмен, фармакологиялық бизнес — күн сайын миллиардтаған ақша айналатын сала екенін ұмытпаған жөн. Дәрілер анықтамалығын ашып, көрсетілімі мен қарсы көрсетілімін оқып көрсеңіз, олардың екіжақты әсеріне көз жеткізесіз: бірін емдейді, екіншісіне зиян тигізеді.\n\nНативті өнімдер олардың ішінде құрамына деген ерекше көзқарасымен ерекшеленеді: ішінде тек табиғи компоненттер бар, химиялық және фармакологиялық заттар қосылмайды. Бұл созылмалы аурулардың даму қаупін азайтуға және өмір сапасын жақсартуға ықпал етеді. Нативті құралдар клиникалық зерттеулерде жақсы нәтиже көрсеткен, ал клиенттердің пікірлері олардың тиімділігін растайды.\n\nРәсімдейміз бе?",
    "cost_cheaper": "Басқа жерден сатып алған кезде қауіпсіздік пен сапаға қатысты тәуекелді өзіңіз мойныңызға аласыз. Біз нарықта 11 жылдан астам жұмыс істеп келеміз, сенімді әрі тұрақты серіктес ретінде бедел қалыптастырдық, барлық құралдар декларациядан өткен және сапа бақылауының барлық кезеңінен бірнеше рет өтеді. Ал қазір жеңілдік бағдарламасының арқасында сатып алудың негізгі бөлігін біз жабамыз, ал Сіз тек аз ғана бөлігін төлейсіз. Яғни, Сіз ең төмен бағаға барынша жақсы сапаға кепілдікпен қол жеткізесіз.\n\nТапсырысты рәсімдейміз бе?",
    "cost_marketplace_health": "Бұл — менің ең сүйікті сұрағым (күлімсіреп айтамыз).\n\nМаркетплейстерде бастапқыда барлық пікірлер тамаша, бәрі 5 жұлдыз қойып тұратынын байқамадыңыз ба? Ал біраз уақыттан кейін «бос нәрсе алыппыз, көмектеспейді» деп жазған көңілі қалған адамдар шыға бастайды. Әрине, ақшаңызды борға ұқсас бос өнімге жұмсауыңызға болады, тек жағдай одан сайын ушықпаса болғаны. Ал Сіз арзанырақ нұсқа іздеп жүрген уақытта, есіңізде болсын: мәселе орнында тұрмайды.\n\n{Имя клиента}, бір нәрсені түсініңізші: біздің құрал — ресми, сертификатталған, табиғи компоненттері бар және сапасына кепілдік берілетін өнім. Маркетплейсте мұндайға ешкім нақты жауап бермейді, сол жерде «қаптағы мысықты» аласыз. Сондықтан бағадағы айырмашылық та осында: бізде Сіз тексерілген, қауіпсіз, жауап берілетін өнім аласыз.\n\nМәселеңізбен қоштасуға дайынсыз ба? Мен мекенжайыңызды жазып алайын, алушы өзіңіз боласыз ба?",
    "doubts_later_full": "Шынын айтайықшы, Сіз кейін тапсырыс бермейсіз. Өйткені әр адамның ай сайын бітпейтін шығыны бар: тоңазытқыш бұзылады, есік ауыстыру керек, көлік істен шығады, балаларға, немерелерге, жұбайға сыйлық алу керек — мұның тізімі шексіз. Сондықтан денсаулықты тағы да кейінге ысырасыз, үйге, отбасыға, жақындарыңызға көңіл бөлесіз, бірақ өзіңізге емес. Солай емес пе?\n\nАйтыңызшы, өтінемін, қазір шешім қабылдауға нақты не кедергі болып тұр? (жауап күтеміз)\n\nЕгер «ақша жоқ / бюджет шектеулі» десе:\nОнда нақтылайын: баға Сізге жайлы болса, қазір рәсімдер ме едіңіз? (жауап күтеміз) Мәселе мынада: баға өсіп жатыр, шикізат қымбаттап жатыр, логистика қымбат, шарттар өзгеріп тұрады. Баға көтерілсе, бұл нұсқаны енді қарамайтыныңызды өзіміз де түсініп тұрмыз. Сондықтан тиімді шартты дәл қазір бекітіп алған дұрыс.\n\nРәсімдейміз бе?\n\nЕгер «дайын емеспін / күмәнім бар» десе:\nМән-жайды нақты түсінгім келеді. Біз көбіне бәрін «кейінге» ысырамыз: дүйсенбіден спортзал, Жаңа жылдан диета... бірақ нәтижесінде ештеңе өзгермейді. Мүмкін, мінсіз сәтті күтпей, дәл қазір мүмкіндікті пайдалану керек шығар. Нақты не ұстап тұр? (жауап күтеміз)\n\nЕгер «жай кейінірек» десе:\nСіз үшін «кейінірек» нақты қашан? (егер нақты күн айтпаса) Онда шынын айтайық: ыңғайлы сәт мүлде болмауы мүмкін, ал қазіргі шарт болашақтағыдан бәрібір тиімдірек. Сондықтан кейінге қалдырмай, қазір рәсімдеген дұрыс.\n\nҚай курсты рәсімдейміз?\n\nҚорытынды жабу:\n{Имя клиента}, шешім әрине өзіңізде. Мен тек дәл бүгін, дәл осы Сізге берілген тиімді шарттармен денсаулықты қауіпсіз әрі ұтымды түрде қалпына келтіру мүмкіндігін ұсынып отырмын.\n\nРәсімдейміз бе?",
    "doubts_order_later": "Кейін де болады, бірақ бір маңызды нюанс бар: өзіңіз де түсінесіз, күн сайын бәрі қымбаттап жатыр — шикізат та, жеткізу де, жалпы баға да. Сондықтан дәл қазір тиімді шартты пайдаланып қалған дұрыс. Екеуміз де түсінеміз: жеңілдік болмаса, бұл тапсырысты қарамайсыз. Сол себепті мүмкіндікті жіберіп алмаңыз, уақыт жоғалтпайық, тапсырысты рәсімдейік.",
    "doubts_think_health": "«Ойланып көремін» деген сөздің артында не тұрғанын түсіну үшін мына сұрақтарды қолдануға болады.\n\n(БІРЕУІН ТАҢДАЙМЫЗ, БӘРІН ҚАТАР ОҚЫМАЙМЫЗ):\n\n1. Егер шешімді кейінге қалдырсаңыз, жағдай өздігінен өзгермейді ғой, солай ма? Тағы бір апта, бір ай бәрін сол күйі қалдыруға дайынсыз ба? Шынын айтқанда, осы мәселемен қанша уақыттан бері жүрсіз? Тағы қанша күткіңіз келеді?\n\nТүсіндірме: {Имя клиента}, ашық айтайықшы, егер қазір ештеңе өзгертпесек, бір аптадан, бір айдан кейін жағдайыңызға бұл қалай әсер етеді? Тағы ұзақ уақыт осымен жүруге дайынсыз ба? (жауап күтеміз) Мүмкін, шешім қабылдайтын уақыт келген шығар? Бұл мәселе Сізде әлдеқашаннан бері бар, әлі қанша ойланасыз?\n\n2. Ашық айтсақ, Сізге шынымен ойлануға уақыт керек пе, әлде бұл менімен сөйлесуден немесе мәселенің өзінен алыстаудың амалы ма?\n\nТүсіндірме: Мен Сізді түсінемін. Уақытты бос жібермегеніміз маңызды. Егер қазір жай ғана қысымсыз үзіліс жасағыңыз келсе, солай да айта аласыз. Ал нақты сұрақтар мазалап тұрса, дәл қазір соны бірге шешейік. Бас тартуға Сіз әрқашан үлгересіз, шешім өзіңізде. Бірақ мен оны ұсынбас едім, өйткені екінші рет кеш болуы мүмкін.\n\n3. Бұрын Сізге қажет, пайдалы бір затты алуды кейінге қалдырып, кейін «ертерек алсам ғой» деп өкінген кезіңіз болды ма?\n\nТүсіндірме: Көп клиентімізде дәл сондай оқиға болған. «Күте тұрайын» деген, кейін «бекер созыппын, мәселені баяғыда шешуге болатын еді» деген. Сіздің жағдайыңызда да солай болуы мүмкін деп ойламайсыз ба? (жауап күтеміз)\n\n4. Өзіңізге «иә, дайынмын» деу үшін не өзгеруі керек?\n\nТүсіндірме: {Имя клиента}, мен қысым жасау үшін емес, көмектесу үшін жанымдамын. Нәтиже алсаңыз, бізді таныстарыңызға айтып жүресіз ғой? Біз дәл солай жұмыс істейміз: нәтижеге және ұсынысқа.\n\n5. «Ойланып көремін» дегенде, Сіз пайдасын таразылап көргіңіз келе ме, әлде дәл қазір қажет-қажет емесін шешіп көргіңіз келе ме?\n\nТүсіндірме: Адал жауабыңызға рақмет. Көбіне адам «ойланамын» дегенде, негізі шешімін ішінен қабылдап қояды, тек күмәнданады. Ал денсаулық — кейінге ысырып қоятын теледидар емес. Мұнда сұрақ біреу ғана: Сіз өзіңізді қазір жақсартқыңыз келе ме, әлде жағдай ушыға түскенше күте бересіз бе? Мен асықтырмаймын. Бірақ егер өнім расында көмектессе және оның керегін түсініп тұрсаңыз, созудың мәні бар ма?\n\n6. Мәселе ушығып кеткенше шешімді тағы қанша уақытқа кейінге қалдыруға дайынсыз?\n\nТүсіндірме: Сіздің жағдайыңыз шешімді қажет етеді. Сұрақ тек біреу: оны қазір шешкіңіз келе ме, әлде кейін қиындап, қымбаттағанда ма? Бүгіннен бастап жағдайды өз қолыңызға алған дұрыс.\n\n7. Егер бұл мәселені қазір шешпесек, бір айдан кейін оңайырақ бола ма, әлде қиынырақ па?\n\nТүсіндірме: {Имя клиента}, шынын айтқанда, оңай болмайды. Көбіне созған сайын қымбатқа түседі. Бір айдан кейін өкінбейсіз дейтін қадамды дәл қазір бірге жасайық па?\n\n8. Көп клиентімізде дәл осылай болды: әуелі күмәнданды, ойланды, кейінге қалдырды. Ал соңында «бұрын шешім қабылдасам ғой» деп өкініп келді. Мен Сізде де солай болғанын қаламаймын.\n\nТүсіндірме: Мен тек ескертіп отырмын — кейінге қалдырғандар кейін уақыт жоғалтқанына өкінді. Сіз де сондай жағдайда қалғыңыз келмейді ғой? Онда кейін өкініш болмайтын шешімді бірге қабылдайық.\n\nҚорытынды: {Имя клиента}, ойланатын уақыт сәл ертерек болған. Себебі бұл мәселе Сізде біраз уақыттан бері бар, бірақ әлі толық шешілмеген. Енді ұзақ ойланатын емес, шешім қабылдайтын сәт келді.\n\nКурсты рәсімдейік, {Имя клиента}, нәтиже өзін көп күттірмейді деп уәде беремін.",
    "doubts_guarantees": "Тәжірибеде клиенттер сенімділік туралы сұрағанда, көбіне біздің жұмыс тәжірибемізді меңзейді: біз 2014 жылдан бері жұмыс істейміз, клиенттердің пікірі бар, тәжірибе бар. Өз тарапымыздан біз сапа кепілдігін беруге дайынбыз. Бізде барлық қажетті құжаттар бар. Өнім зерттеу нәтижелері бойынша сәйкестік декларациясынан өткен.",
    "doubts_bought_before": "Сезіміңізді түсінемін. Өкінішке қарай, әрдайым сенімді сатушылар кездесе бермейді. Өзімде де ондай жағдай болған. {Имя клиента}, мен бұл салада 10 жылдан астам жұмыс істеймін, және дәл Сіздің жағдайыңызға қажет дозаны жеке есептеп беремін, бәріне бірдей ортақ нәрсе ұсынбаймын. Мен үшін ӘРБІР клиент қымбат, еш ерекшеліксіз. Сіз расымен біз Сізге сондай нәрсе жіберіп, кейін Сіз бізбен байланысуды тоқтатасыз деп ойлайсыз ба? Әрине, ЖОҚ! Бұл бізге тиімді емес. Керісінше, біз әрдайым Сіз сияқты клиенттер нәтижеге риза болып, бізді есте сақтап, жақындарына ұсынғанын қалаймыз. Сондықтан бүгін ең жақсы құралдар дәл Сіз үшін. Сіз бұған әбден лайықсыз. Кейін өзіңіз де күмәнданғаныңызға күліп жүретін боласыз!\n\nТапсырысты рәсімдейміз бе?",
    "doubts_not_help": "{Имя клиента}, (өнім атауы) сапа бақылауының барлық қажетті кезеңінен өтті және өзінің тиімділігін дәлелдеді. Сіз өзіңізді ғана осындай жағдайдамын деп ойлайсыз ба? Әрине, жоқ. Бұл құралды (клиенттің мәселесін атаңыз) қалпына келтіру, нығайту және денсаулықты қолдау үшін көп адам қолданады. Сіз қайтадан толыққанды өмір сүргіңіз келеді ғой? Әрине, қалайсыз. Ал (өнім атауы) бұл мәселені ұзақ уақытқа шешуге көмектеседі. Оның үстіне Сіздің жағдайда курс 90 000 теңге тұрады, ал жеңілдікпен бар болғаны 37 000 теңге болады. Осындай мүмкіндікті жіберіп алу өкінішті емес пе? (жауап күтеміз)\n\n(Өнім атауы) әлемдегі (мәселені атаңыз) қалпына келтіруге арналған ең үздік 5 құралдың қатарына кіреді, ал Қазақстанда ол жалғыз. Мен Сізге жетекші маман ретінде қоңырау шалып, тек құжаттары бар, тексерілген құралдарды ұсынып отырмын. Сондықтан дені сау адамның толыққанды өміріне қайта оралу мүмкіндігін жіберіп алмаңыз.\n\nТапсырысты рәсімдейміз бе?",
    "doubts_never_heard": "Мүмкін, Сіз жай ғана ұмытып қалған шығарсыз. Бұл қалыпты жағдай. Біздің орталық 11 жылдан астам уақыттан бері жұмыс істейді, және клиенттердің басым бөлігімен әңгімеміз дәл осындай сөзден басталады. Ендеше, теориямен емес, нәтижемен бағалайық. Өнімнің әсерін сырттай бағалау мүмкін емес, оны көру үшін қабылдауды бастау керек. Тапсырыс беріп көріңіз, өкінбейсіз.\n\nТапсырысты рәсімдейміз бе?",
    "doubts_doctor": "Сіз маған сенбей тұрсыз ба?\n\nӘрине, әр адам өзі сенетін маманмен ақылдасқысы келеді, оны түсінемін. Бірақ бұл жерде дәрігердің әдеттегі ресми сөзін күту дұрыс болмауы мүмкін. Өйткені көп жағдайда дәрігер емделіп кеткеніңіз үшін емес, қабылдау үшін ақы алады, ал жүйенің өзі көбіне қаржы айналымына тәуелді. Соның салдарынан кейде тиімсіз нәрсені ұзақ ұсынып, дозасын қайта-қайта көтере береді.\n\nАл біздің жағдайда Сіз тиімділігі мен қауіпсіздігі дәлелденген құрал алып отырсыз. Оның үстіне дәл қазір Сізде денсаулықты қалпына келтіруге көмектесетін құралды тиімді шартпен алу мүмкіндігі бар.\n\nДұрыс па?\n\nТапсырысты рәсімдейміз бе?",
    "doubts_family": "Егер құпия болмаса, жұбайыңыздан қандай жауап күтіп отырсыз? (жауап күтеміз) Бүгін үнемдеу мүмкіндігі тұрғанда, ертең көбірек ақша жұмсауға қарсы болады деп ойламаймын.\n\nЕгер шешімді дәл қазір қабылдасаңыз, Сіз қысқа уақыт ішінде және денсаулыққа қауіпсіз түрде… (клиенттің мәселесін атаңыз) қалпына келтіруді бастайсыз.\n\nРәсімдейміз бе?",
    "scam_you": "Сақ болғаныңыз өте дұрыс! Қазіргі интернет пен сан түрлі онлайн-дүкендердің заманында алаяқтық расында көп, сондықтан мұқият болғаныңыз құптарлық. Мен Сізді өте жақсы түсінемін. Бірақ біз қайта сататын интернет-дүкен емеспіз. Біз — өндірушінің ресми өкіліміз, «Здоровье +» орталығы, «Салауатты ұлт» бағдарламасы аясында жұмыс істейміз. 11 жылдан астам уақыттан бері жұмыс істеп, сенімді әрі тұрақты серіктес ретінде танылдық. Барлық өнім бірнеше рет тексеріледі: алдымен қоймаға түскенде, содан кейін тікелей Сізге жіберілер алдында. Сенімді түрде айта аламын: нәтижесін сезгеннен кейін, Сіз бізге көп клиентіміз сияқты алғыс айтып хабарласасыз. Сіз өз мәселеңізді әлдеқашан шешкіңіз келіп жүрген жоқсыз ба?\n\nТапсырысты рәсімдейміз бе?",
    "scam_nothing": "Мен Сіздің күмәніңізді түсінемін, бірақ менің мақсатым — бірдеңені күштеп өткізу емес. Мен тек осы айда Сіз және тағы бір адам пайдалана алатын жеңілдік бағдарламасы туралы хабарлап отырмын. Біз Сізге көмек керек екенін білеміз және ұсыныстың Сізге тиімді болғанын қалаймыз. Таңдау әрқашан өзіңізде. Ескеретін жайт: жеңілдік бағдарламасы құнның негізгі бөлігін жабады, ал Сіз сапалы құрал үшін аз ғана соманы қосасыз.\n\nТапсырысты рәсімдейміз бе?",
    "scam_plain": "Қазір біз Сізден ақша алмаймыз, тек шартты бекітеміз. Төлем — тауарды алған кезде.",
    "scam_office": "Қазір қарап шығайын, жеке кездесудің расында қажеті бар ма. Негізі, келуге болады, бірақ Сіз айтып отырған белгілерге қарағанда жағдайыңыз аса шұғыл емес. Сізде әзірге мынадай ауыр асқынулар жоқ қой?\n\nҰсынысқа қарай лайық сұрақты таңдаймыз, сонда клиент нақты «жоқ, ондай жоқ» деп жауап беруі керек.\n\nМысалы:\n— Арықтау бағыты болса — диабеттік табан әлі пайда болған жоқ па?\n— Жүрек пен тамыр болса — трофикалық жара жоқ па?\n— Асқазан-ішек немесе паразит бағыты болса — нәжісте қан жоқ па?\n— Ерлер денсаулығы, простатит, цистит болса — зәрде қан жоқ па?\n— Буын болса — аяқ-қолдың ұюы мен бұлшықет атрофиясы жоқ па?\n— Көру болса — катаракта, глаукома, тор қабық атрофиясы жоқ па?\nжәне т.б.\n\nДәл ондай жоқ па? (жауап күтеміз, нақтылаймыз)\n\nЖақсы, онда менің ойымша, әзірге жеке консультацияның аса қажеті жоқ, {Имя клиента}.\n\nЕгер бәрібір жеке келгіңіз келсе, жарты жылдан кейінгі күнге жазып қоя аламын — келу оңай емес екенін түсінесіз ғой. Сұрақ: сонша күткіңіз келе ме және 5 есе қымбат төлеуге дайынсыз ба?\n\nНегізі шешім өзіңізде. Бірақ қазіргі кезеңде жеке кездесусіз-ақ жұмыс істеуге болады, өйткені мен Сізге қашықтан оңтайлы доза мен қалпына келу сызбасын таңдап қойдым. Тәжірибем жеткілікті, сондықтан әзірге келмей-ақ, уақытыңыз бен ақшаңызды үнемдей аласыз.",
    "safety_trials": "Клиникалық сынақтар өнім әзірлену кезеңінде жүргізіледі. Құрал сатылымға шықпас бұрын біз клиникалық зерттеулер өткіземіз және сапа мен қауіпсіздік стандарттарының бәріне сәйкес болуын қамтамасыз етеміз. Әр қаптамада QR-код басылған, телефон камерасын апарсаңыз, осы тауарға берілген сәйкестік декларациясын аша аласыз. Алаңдамаңыз, нәтиже Сізді жағымды таңғалдырады.\n\nТапсырысты рәсімдейміз бе?",
    "safety_allergy": "Онда Сізге біз тіпті көбірек лайықпыз! Өйткені біздің өнім гипоаллергенді, яғни аллергия шақырмайтын құраммен жасалған. Компаниямыз аллергияға бейім клиенттерді де ойлайды.\n\nАллергиялық реакция көбіне табиғи өнімнің тазартылмаған түріне немесе дәріханалық құралдарға болады: бірінші жағдайда құрамында аллерген сақталады, екінші жағдайда фармакологиялық өңдеуден өткен қоспалар әсер етуі мүмкін. Ал біздің құралдың формуласы компоненттерді аллергеннен барынша тазартып жасалған, сонымен бірге ішінде зиянды фармқұрам жоқ. Яғни, аллергиясы бар адам үшін өнім барынша қауіпсіз. Ерекше жағдай — жекелеген тазартылған компонентке жедел жеке көтере алмаушылық, бірақ ол 100 адамның шамамен 2-сінде ғана кездеседі.\n\nТапсырысты рәсімдейміз бе?",
    "safety_return": "Егер рәсімдегеннен кейін сұрақтар туындаса, қолдау қызметіне хабарласып, әрі қарай не істеу керегін нақтылап алуға болады.",
    "safety_bad_or_medicine": "БАД пен біздің өнімнің айырмашылығын дұрыс түсіну маңызды.\n\nБіздің концентрат — БАД та емес, дәрі де емес, «сиқырлы таблетка» да емес. Бұл өсімдік сығындылары негізіндегі табиғи тағамдық концентрат, ол ағзадағы қалпына келу үдерістерін іштен іске қосуға бағытталған.\n\nНегізгі айырмашылық — өндіріс тәсілінде. Көп БАД жоғары температурамен немесе синтетикалық қоспалармен жасалады. Ал біздің концентрат суық гидролиз әдісімен өндіріледі — бұл қыздырмайтын, химия қолданылмайтын жұмсақ технология, соның арқасында пайдалы заттар барынша сақталады.\n\nСонымен қатар бізде:\n— 100% табиғи құрам\n— Қауіпсіздігі расталған өнім\n— Қайталанып ішуге ыңғайлы формат\n— Ағзаға жұмсақ әсер\n\nЯғни бұл классикалық дәріханалық сызбадан бөлек, өзіндік артықшылығы бар өнім форматы.",
    "silent_order_later": "Егер кейінге қалдырсаңыз, қазіргі шарт өзгеріп кетуі мүмкін. Сондықтан дәл қазір бекітіп алған дұрыс.",
    "silent_call_me": "Әрине, Сіз бізге қайта қоңырау шала аласыз. Бірақ бір нәрсеге назар аударыңыз: дәл қазір талқылап отырған жеңілдік шарты кейін болмауы мүмкін. Сондықтан шешімді қазір қабылдаған тиімді. Қазір рәсімдеңіз, сонда нәтижеге риза болып, бізді жақындарыңызға ұсынатындарыңызға сенімдімін.",
    "silent_give_to_other": "Бұл жеңілдік бағдарламасы тек Сізге ғана бекітілген. Оны басқа адамға беру мүмкін емес. Мен Сізді күштеп тұрған жоқпын, қаласаңыз аннулировать ете аламыз. Бірақ былтыр бас тартқанда 12 829 теңгедей, ал биыл тағы шамамен 12 000 теңге көлеміндегі мүмкіндікті жоғалтып отырсыз. Барлығы 24 000 теңгеден асады. Артық ақша ешкімде жоқ қой, солай емес пе?\n\nЕгер денсаулық туралы айтсақ:\nҚаламасаңыз — алмаңыз, мен мәжбүрлемеймін. Бірақ кейін кәдімгі дәріханаға барып, өзіңізге не жақыныңызға денсаулық үшін бірдеңе алсаңыз, бәрібір көбірек ақша жұмсайсыз, әрі оның түпнұсқа өндіруші өнімі екені де белгісіз болуы мүмкін.\n\nРәсімдейміз бе?",
    "silent_later_callback": "{Имя клиента}, ашық айтайықшы, Сіз кейін тапсырыс бермейсіз. Өйткені әр айда бітпейтін шығындар шығады: бірде тоңазытқыш, бірде есік, бірде көлік, бірде бала-шағаға керек нәрсе. Соның арасында өз денсаулығыңыз тағы кейінге қалады. Үйге, отбасыға, жақындарға жұмсайсыз, бірақ өзіңізге емес. Солай ғой?\n\nШынын айтыңызшы, шешім қабылдауға қазір нақты не кедергі болып тұр? (жауап күтеміз)\n\nЕгер «ақша жоқ / бюджет шектеулі» десе:\nОнда былай сұрайын: баға ыңғайлы болса, қазір рәсімдер ме едіңіз? (жауап күтеміз) Мәселе мынада — баға өсіп жатыр, шикізат та, жеткізу де қымбаттап барады, шарттар өзгеріп тұрады. Баға көтерілсе, бұл нұсқаны қарамайтыныңызды өзіміз де түсінеміз. Сондықтан тиімді шартты дәл қазір бекіткен дұрыс.\n\nРәсімдейміз бе?\n\nЕгер «дайын емеспін / күмәнім бар» десе:\nМен нақты себебін түсінгім келеді. Біз бәрін «кейінге» қалдыра береміз: дүйсенбіден спортзал, Жаңа жылдан диета... бірақ іс жүзінде ештеңе өзгермейді. Бәлкім, идеалды сәтті күтпей, дәл қазір мүмкіндікті пайдалану керек шығар. Нақты не кедергі? (жауап күтеміз)\n\nЕгер «жай кейінірек» десе:\nСіз үшін «кейінірек» нақты қашан? Егер нақты күн болмаса, онда шынын айтайық — ыңғайлы сәт мүлде болмауы мүмкін, ал қазіргі шарт бәрібір тиімдірек. Сондықтан кейінге қалдырмай, қазір рәсімдеген дұрыс.\n\nҚай курсты рәсімдейміз?\n\nҚорытынды:\n{Имя клиента}, шешім өзіңізде. Мен Сізге тек дәл бүгін, дәл осы арнайы шарттармен денсаулықты қауіпсіз әрі тиімді түрде қалпына келтіру мүмкіндігін ұсынып отырмын.\n\nРәсімдейміз бе?",
    "negative_bought_before": "Сезіміңізді түсінемін. Өкінішке қарай, әрдайым сенімді сатушы кездесе бермейді. Өзімде де сондай тәжірибе болған. {Имя клиента}, мен бұл салада 10 жылдан астам жұмыс істеймін, және дәл Сізге қажет дозаны жеке есептеп беремін, бәріне бірдей бір нұсқа ұсынбаймын. Мен үшін ӘРБІР клиент қымбат. Сіз расымен біз сондай нәрсе жіберіп, кейін Сіз бізбен жұмыс істемей қоясыз деп ойлайсыз ба? Әрине, жоқ. Бұл бізге тиімсіз. Біз әрқашан Сіз сияқты клиенттердің риза болып, бізді есте сақтап, таныстарына ұсынғанын қалаймыз. Сондықтан бүгін ең жақсы құрал дәл Сіз үшін. Сіз бұған әбден лайықсыз. Кейін күмәнданғаныңызға өзіңіз күлесіз.\n\nТапсырысты рәсімдейміз бе?",
    "negative_reviews": "Қазіргі уақытта бедел — бәрі. Сондықтан біз клиент нақты күткенін алуына ерекше көңіл бөлеміз. Риза клиент біз үшін әрқашан бірінші орында. Құралдың әсеріне қатысты шағымдар болған жоқ. Бізге көбіне бұрын тапсырыс берген адамдардың ұсынысымен хабарласады. Ал интернетте жақсы пікір де, жаман пікір де табылады, оны өзіңіз де жақсы түсінесіз.\n\nТапсырысты рәсімдеп, тиімділігіне өзіңіз көз жеткізесіз бе?",

          { label:'Пожилой клиент, откуда номер?', label_kz:'Егде клиент, нөмір қайдан?', color:'red', text:{ru:`{Имя клиента}, понимаю Ваш вопрос. Контакт попал в базу обращений по линии консультаций, поэтому сейчас я звоню, чтобы сообщить о доступной программе и уточнить, актуален ли для Вас вопрос здоровья. Если Вам неудобно сейчас, я могу очень коротко объяснить суть звонка.`, kz:`{Имя клиента}, сұрағыңызды түсінемін. Нөміріңіз консультация бағыты бойынша жиналған базаға түскен. Сол себепті қазір қолжетімді бағдарлама туралы айту және денсаулық тақырыбы Сіз үшін әлі де өзекті ме, соны нақтылау үшін хабарласып отырмын. Қазір ыңғайсыз болса, мәнін өте қысқа айтып өтемін.`} },
          { label:'Это развод', label_kz:'Бұл алаяқтық', color:'red', text:{ru:`Что в Вашем понимании слово "развод”. (ждём ответа) Международный центр "Здоровье +" - это официальная компания, которая работает по законодательству более 11 лет в нескольких странах. Как клиент и потребитель Вы надёжно защищены! Все наши разговоры записываются и прослушиваются. Я у Вас денег не прошу, связь для Вас бесплатная. Единственное, что я от Вас хочу - это узнать состояние Вашего здоровья. Как обстоят дела со здоровьем сейчас, Имя клиента?`, kz:`Сіздің түсінігіңізде «алаяқтық» деген не? (жауап күтеміз)

«Здоровье +» халықаралық орталығы — бірнеше елде 11 жылдан астам заңды жұмыс істеп келе жатқан ресми компания. Клиент ретінде де, тұтынушы ретінде де қорғалғансыз. Барлық қоңыраулар жазылады. Мен Сізден ақша сұрап тұрған жоқпын, байланыс Сіз үшін тегін. Маған керегі — денсаулық жағдайыңызды түсіну ғана. Қазір денсаулығыңыз қалай, {Имя клиента}?`} },
          { label:'Мошенники', label_kz:'Алаяқтар', color:'red', text:{ru:`Давайте по честному, когда звонят мошенники, они что просят? Просят Ваши личные данные, перейти по ссылкам спама, зарегистрироваться где-то или еще хуже, сразу вымогают деньги для родственников. Я сам(а) не раз попадался(ась) на их уловки. И скажите пожалуйста, я Вас прошу сделать хоть что-то из этого? Нет. Я же Вам звоню по поводу Вашей проблемы и Вашего здоровья.`, kz:`Шынын айтайық, алаяқтар қоңырау шалғанда не сұрайды? Жеке деректеріңізді, күмәнді сілтемеге өтуді, бір жерге тіркелуді немесе бірден ақша аударуды сұрайды. Мен Сізден соның біреуін сұрап тұрмын ба? Жоқ. Мен Сізге денсаулығыңыз бен мәселеңіз бойынша хабарласып тұрмын.`} },
          { label:'Клиент не хочет разговаривать: некогда/занят, перезвоню сам, меня это не интересует, мне ничего не надо/сбросил на приветствии', label_kz:'Клиент сөйлескісі келмейді', color:'red', long:true, text:{ru:`Понимаю, {Имя клиента}. Не хочу занимать Ваше время. Тогда скажу только самое важное: звонок короткий и по конкретному вопросу, без обязательств с Вашей стороны. Если сейчас совсем неудобно — можем завершить, либо я задам буквально один уточняющий вопрос и Вы сразу поймёте, актуально это для Вас или нет.`, kz:`Түсінемін, {Имя клиента}. Уақытыңызды алмайын. Онда ең маңыздысын ғана айтайын: қоңырау қысқа, нақты мәселе бойынша және Сізге ешқандай міндет жүктемейді. Егер қазір мүлде ыңғайсыз болса — аяқтаймыз, не болмаса бір ғана нақтылау сұрағын қояйын, сонда бұл Сіз үшін өзекті ме, жоқ па — бірден түсінесіз.`} },
          { label:'Почему звоните с разных номеров?', label_kz:'Неге әртүрлі нөмірден қоңырау шаласыз?', color:'red', text:{ru:`{Имя клиента}, иногда исходящие звонки действительно могут идти с разных рабочих линий — это связано с распределением нагрузки между операторами. Суть обращения при этом не меняется: я звоню Вам по вопросу консультации и программы, о которой хотел(а) коротко рассказать.`, kz:`{Имя клиента}, кейде шығыс қоңыраулар әртүрлі жұмыс желілерінен түсуі мүмкін — бұл операторлар арасындағы жүктемені бөлумен байланысты. Бірақ қоңыраудың мәні өзгермейді: мен Сізге консультация мен бағдарлама бойынша қысқаша ақпарат беру үшін хабарласып тұрмын.`} },
          { label:'Вы мне сейчас будете что-то предлагать купить', label_kz:'Қазір маған бірдеңе ұсынасыз ба?', color:'red', text:{ru:`{Имя клиента}, я Вам ничего не предлагаю покупать. Мой звонок несёт информативный характер. Моя задача, как старшего эксперта, проинформировать Вас о льготной программе и подобрать для Вас решение проблемы.`, kz:`{Имя клиента}, мен Сізге қазір ештеңе сатып алуды ұсынып тұрған жоқпын. Бұл қоңырау ақпараттық сипатта. Менің міндетім — жеңілдік бағдарламасы туралы хабарлап, мәселеңізге лайық шешімді таңдауға көмектесу.`} },
          { label:'Сбросил на приветствии', label_kz:'Сәлемдесуде тұтқаны қойды', color:'red', text:{ru:`{Имя клиента}, могу понять Вашу реакцию сейчас, в двух словах скажу, я звоню порадовать Вас хорошей новостью. Вам одобрили льготную программу, от международного центра "Здоровье +", по программе "Здоровая нация", на восстановление здоровья, у Вас же была проблема, которую хотели решить? (ждём ответа, независимо от ответа продолжаем) Вот именно поэтому и звоню. Буквально пару минут Вашего времени займу и расскажу как мы с Вами поступим дальше, хорошо?`, kz:`{Имя клиента}, реакцияңызды түсінемін. Қысқаша айтсам, мен Сізге жақсы жаңалық айту үшін хабарласып тұрмын. Сізге «Здоровье +» халықаралық орталығының «Салауатты ұлт» бағдарламасы бойынша денсаулықты қалпына келтіруге арналған жеңілдік мақұлданды. Шешкіңіз келген денсаулық мәселесі болған ғой? (жауап күтеміз, жауапқа қарамастан жалғастырамыз) Міне, сондықтан хабарласып тұрмын. Екі-ақ минут уақытыңызды алайын, ары қарай не істейтінімізді түсіндіріп беремін, жарай ма?`} },
          { label:'Какие гарантии?', label_kz:'Қандай кепілдіктер бар?', color:'red', text:{ru:`По опыту, когда клиенты говорят о надежности, очень часто имеют в виду наш опыт (работаем с 2014 года), отзывы наших клиентов. Со своей стороны мы готовы предоставить гарантии качества. У нас все необходимые документы имеются. Декларация соответствия по результатам исследований товара.`, kz:`Тәжірибеде клиенттер сенімділік туралы сұрағанда, көбіне біздің жұмыс тәжірибемізді, клиент пікірлерін және құжаттардың болуын меңзейді. Біз 2014 жылдан бері жұмыс істейміз. Өз тарапымыздан сапа кепілдігін береміз. Қажетті құжаттардың бәрі бар, соның ішінде зерттеу нәтижелері бойынша сәйкестік декларациясы да бар.`} },
          { label:'Сколько стоит? Какая цена?', label_kz:'Бағасы қанша?', color:'red', text:{ru:`Сейчас я не предлагаю Вам ничего платить, я звоню для того, чтобы подобрать Вам лучшую программу для восстановления и понять, как лучше помочь Вам позаботиться о своем здоровье. У Вас же есть проблема, которую Вы хотите решить? Давайте не будем терять времени и начнём решать.`, kz:`Қазір мен Сізден ештеңе төлеуді сұрап тұрған жоқпын. Менің қоңырау шалу себебім — Сізге лайықты қалпына келтіру бағдарламасын таңдау және денсаулығыңызға қалай дұрыс көмектесуге болатынын түсіну. Шешкіңіз келетін мәселе бар ғой? Онда уақыт жоғалтпай, соны шешуге көшейік.`} },
          { label:'Клиент утверждает, что никуда не обращался по поводу здоровья', label_kz:'Клиент ешқайда жүгінбегенін айтады', color:'red', long:true, text:{ru:`{Имя клиента}, Вариант 1

Имя клиента, возможно, Вы уже и не вспомните - база формируется автоматически, туда попадают клиенты, которые когда-то интересовались программами восстановления. Главное не это, а то, что сейчас у Вас закреплена льготная возможность, и я звоню, чтобы Вы её не потеряли. Давайте расскажу суть в двух словах?

Вариант 2

Имя клиента, может быть, это было достаточно давно, поэтому и не осталось в памяти. У нас база обновляется постоянно, и туда попадают только те, кто хоть раз интересовался нашим направлением. Видимо, Вы были среди них, поэтому система и выделила Вам персональную программу. Я Вам коротко объясню, в чём суть?`, kz:`{Имя клиента}, 1-нұсқа

Мүмкін, қазір есіңізде жоқ шығар — база автоматты түрде қалыптасады, оған бір кезде қалпына келтіру бағдарламаларына қызыққан клиенттер түседі. Ең маңыздысы ол емес, маңыздысы — дәл қазір Сізге жеңілдік мүмкіндігі бекітілген, мен соны жоғалтып алмауыңыз үшін хабарласып тұрмын. Екі ауыз сөзбен түсіндіріп өтейін бе?

2-нұсқа

Мүмкін, бұл біраз бұрын болған шығар, сондықтан есте қалмаған. База үнемі жаңарып тұрады, оған біздің бағытқа бір рет болса да қызыққан адамдар түседі. Сол себепті жүйе Сізге жеке бағдарламаны белгілеп отыр. Қысқаша мәнін айтып берейін бе?`} },

          { label:'Клиент просит перезвонить', label_kz:'Клиент қайта қоңырау шалуды сұрайды', color:'red', text:{ru:`Подскажите, пожалуйста, {Имя клиента} я понимаю, что Вы заняты, у нас обоих плотный график, но много Вашего времени я не займу. Я звоню по поводу Вашего льготной программы, остались считаные часы, если ее не использовать - она может сегодня прогореть, и Вы потеряете хорошую возможность на восстановление. Давайте я коротко расскажу суть моего звонка.`, kz:`{Имя клиента}, Сіздің бос емес екеніңізді түсінемін, екеуміздің де уақытымыз тығыз. Мен көп уақытыңызды алмаймын. Қоңырау шалу себебім — Сіздің жеңілдік бағдарламаңыз. Егер оны қазір пайдаланбасаңыз, бүгін күшін жоғалтуы мүмкін, сол кезде жақсы мүмкіндіктен айырылып қаласыз. Мен қоңыраудың мәнін өте қысқа айтып шығайын.`} },
          { label:'Клиент говорит, что перезвонит самостоятельно', label_kz:'Клиент өзі қайта қоңырау шалатынын айтады', color:'red', text:{ru:`{Имя клиента}, у нас только односторонняя линия, поэтому Вы до нас дозвониться просто не сможете. Я понимаю, что Вы заняты, у нас обоих плотный график, но много Вашего времени я не займу. Я звоню по поводу Вашего льготной программы, остались считаные часы, если ее не использовать - она может сегодня прогореть, и Вы потеряете хорошую возможность на восстановление. Давайте я коротко расскажу суть моего звонка.`, kz:`{Имя клиента}, бізде біржақты желі, сондықтан Сіз бізге өзіңіз қайта қоңырау шала алмайсыз. Сіздің бос емес екеніңізді түсінемін, екеуміздің де кестеміз тығыз. Бірақ көп уақытыңызды алмаймын. Қазір Сізге жеңілдік бағдарламаңыз бойынша хабарласып тұрмын: егер бүгін пайдаланбасаңыз, мүмкіндік күйіп кетуі мүмкін. Қоңыраудың мәнін өте қысқа айтып шығайын.`} }

      if (state.lang === 'kz'){

        if (override) return postProcessKzVisibleText(override);
        const chosen = (primary || kz || ru || '');
        return postProcessKzVisibleText(chosen);
      }
      return primary || ru || kz || '';
    }
    return '';
  }

  function escapeHtml(str){
    return (str ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'", '&#039;');
  }

      .replaceAll('{Имя оператора}', '[[OP]]')
      .replaceAll('{Цена}', '[[PRICE_BASE]]')
      .replaceAll('{Льгота}', '[[BENEFIT]]')
      .replaceAll('{ДопСкидка}', '[[EXTRA_DISCOUNT]]')
      .replaceAll('{Итог}', '[[PRICE_FINAL]]')
      .replaceAll('[[RED_BOLD_START]]', '[[RED_BOLD_START_TOKEN]]')
      .replaceAll('[[RED_BOLD_END]]', '[[RED_BOLD_END_TOKEN]]');

    s = escapeHtml(s)
      .replaceAll('[[CLIENT]]', `<span class="tokenClient">${escapeHtml(t.client)}</span>`)
      .replaceAll('[[OP]]', escapeHtml(t.op))
      .replaceAll('[[PRICE_BASE]]', escapeHtml(t.priceBase))
      .replaceAll('[[BENEFIT]]', escapeHtml(t.benefit))
      .replaceAll('[[EXTRA_DISCOUNT]]', escapeHtml(t.extraDiscount))
      .replaceAll('[[PRICE_FINAL]]', escapeHtml(t.priceFinal))
      .replaceAll('[[RED_BOLD_START_TOKEN]]', `<span class="replicaRedBold">`)
      .replaceAll('[[RED_BOLD_END_TOKEN]]', `</span>`);

    return s.replaceAll('\n','<br>');

    if (section && (section.id === 'price' || section.id === 'checkout')) {
      const priceOfferHtml = applyTokensToReplicaHtml(state.lang === 'kz' ? TEXT.kz.price_offer : TEXT.ru.price_offer);
      parts.push(`<div class="textBlock">${priceOfferHtml}</div>`);
    }

    if (section && section.id === 'price') {
      parts.push(`<div class="textBlock">${applyTokensToReplicaHtml(state.lang === 'kz' ? TEXT.kz.price_address : TEXT.ru.price_address)}</div>`);
    }

    if (section && section.id === 'checkout') {
      parts.push(`<div class="textBlock">${applyTokensToReplicaHtml(getPrepaymentIntroText())}</div>`);
      const objectionButtons = getPrepaymentButtons().filter(btn => matchesSearch(`${localizedLabel(btn)} ${localizedText(btn.text, btn.label)}`));
      if (objectionButtons.length) {
        const buttonsHtml = objectionButtons.map(btn => `<button type="button" class="chip red${selectedPrepayKey === btn.key ? ' active' : ''} replicaPrepayBtn" data-prepay-key="${escapeHtml(btn.key)}">${escapeHtml(localizedLabel(btn))}</button>`).join('');
        parts.push(`<div class="replicaDeliveryLead">${escapeHtml(state.lang === 'kz' ? 'Алдын ала төлем бойынша қарсылықтар:' : 'Возражения по предоплате:')}</div>`);
        parts.push(`<div class="btnGrid replicaPrepayButtons">${buttonsHtml}</div>`);
      }
      if (selectedPrepayKey && PREPAYMENT_OBJECTIONS[selectedPrepayKey]) {
        parts.push(`<div class="replicaDeliveryContent">${applyTokensToReplicaHtml(localizedText(PREPAYMENT_OBJECTIONS[selectedPrepayKey].text, PREPAYMENT_OBJECTIONS[selectedPrepayKey].label))}</div>`);
      }
    }

    return parts.join('');
  }

  function renderDeliveryReplica(section, selectedLabel='', selectedPrepayKey=''){
    if (!section) return;
    const list = getDeliveryButtons(section).filter(btn => matchesSearch(`${localizedLabel(btn)} ${localizedText(btn.text, btn.label)}`));
    const selectedBtn = getDeliveryButtons(section).find(item => item.label === selectedLabel) || null;
    const lead = state.lang === 'kz' ? 'Жеткізу түрін таңдаңыз:' : 'Мы можем вам доставить?';
    const emptyText = state.lang === 'kz' ? 'Бұл іздеу бойынша жеткізу нұсқалары табылмады.' : 'По текущему поиску варианты доставки не найдены.';
    const placeholder = state.lang === 'kz' ? 'Төмендегі батырмалардың бірін таңдаңыз.' : 'Выберите один из вариантов ниже.';
    const currentPrepayKey = selectedPrepayKey || getPrepaySelectedKey(section) || '';
    if (state.prepayObjectionKeyBySection) state.prepayObjectionKeyBySection[section.id] = currentPrepayKey;
    setReplicaImage('');
    state.activeKey = selectedBtn ? `${section.id}||deliveryOption||${selectedBtn.label}` : `${section.id}||deliveryChooser`;
    replicaMetaEl.textContent = `${sectionTitle(section)} → ${state.lang === 'kz' ? 'Жеткізу нұсқалары' : 'Варианты доставки'}`;

    if (!list.length) {
      replicaTextEl.innerHTML = `${buildReplicaIntroHtml(section, selectedLabel, currentPrepayKey)}<div class="replicaDeliveryLead">${escapeHtml(lead)}</div><div class="replicaDeliveryPlaceholder">${escapeHtml(emptyText)}</div>`;
      return;
    }

    const buttonsHtml = list.map(btn => `<button type="button" class="chip ${escapeHtml(btn.color || 'purple')}${selectedBtn && selectedBtn.label === btn.label ? ' active' : ''} replicaDeliveryBtn" data-delivery-label="${escapeHtml(btn.label)}">${escapeHtml(localizedLabel(btn))}</button>`).join('');
    const contentHtml = selectedBtn
      ? applyTokensToReplicaHtml(localizedText(selectedBtn.text, selectedBtn.label))
      : `<div class="replicaDeliveryPlaceholder">${escapeHtml(placeholder)}</div>`;

    replicaTextEl.innerHTML = `${buildReplicaIntroHtml(section, selectedLabel, currentPrepayKey)}<div class="replicaDeliveryLead">${escapeHtml(lead)}</div><div class="btnGrid replicaDeliveryButtons">${buttonsHtml}</div><div class="replicaDeliveryContent">${contentHtml}</div>`;
    replicaTextEl.querySelectorAll('.replicaDeliveryBtn').forEach(el => {
      el.onclick = () => openDeliveryOption(section, el.getAttribute('data-delivery-label') || '');
    });
    replicaTextEl.querySelectorAll('.replicaPrepayBtn').forEach(el => {
      el.onclick = () => openPrepayObjection(section, selectedBtn ? selectedBtn.label : '', el.getAttribute('data-prepay-key') || '');
    });
  }

  function openDeliveryChooser(section){
    renderDeliveryReplica(section, '');
  }

  function openDeliveryOption(section, label){
    renderDeliveryReplica(section, label);
  }

  function setReplica(sectionTitleText, btnLabelText, text){
    setReplicaImage('');
    replicaMetaEl.textContent = `${sectionTitleText} → ${btnLabelText}`;
    replicaTextEl.innerHTML = applyTokensToReplicaHtml(text);
  }

  function matchesSearch(hay){
    const q = state.search.trim().toLowerCase();
    if (!q) return true;
    return (hay || '').toLowerCase().includes(q);
  }

  function goToSection(id){
    if (!FLOW.includes(id)) return;
    state.sectionId = id;
    state.activeKey = null;
    render();
  }

  function renderTopUI(){
    document.documentElement.lang = state.lang === 'kz' ? 'kk' : 'ru';
    sbTitleEl.textContent = ui('appMenu');
    lblClientEl.textContent = ui('clientLabel');
    lblOpEl.textContent = ui('opLabel');
    document.getElementById('clientName').placeholder = ui('clientPh');
    document.getElementById('opName').placeholder = ui('opPh');
    document.getElementById('search').placeholder = ui('searchPh');
    btnPrevEl.textContent = ui('prev');
    btnNextEl.textContent = ui('next');
    btnLangEl.textContent = state.lang === 'ru' ? ui('langBtn') : ui('langBtnBack');
    replicaLabelEl.textContent = ui('replicaLabel');
    if (!state.activeKey) replicaMetaEl.textContent = ui('replicaHint');
    setDefaultPricePill();
  }

  function renderStagePills(){
    stagePillsEl.innerHTML = '';
    SECTIONS.forEach(s => {
      const b = document.createElement('button');
      b.className = `stagePill ${s.id === state.sectionId ? 'active' : ''}`;
      b.textContent = sectionTitle(s);
      b.onclick = () => goToSection(s.id);
      stagePillsEl.appendChild(b);
    });
  }

  function renderMenu(){
    menuEl.innerHTML = '';
    SECTIONS.forEach(s => {
      const a = document.createElement('a');
      a.href = '#';
      a.textContent = sectionTitle(s);
      if (s.id === state.sectionId) a.classList.add('active');
      a.onclick = (e) => { e.preventDefault(); goToSection(s.id); };
      menuEl.appendChild(a);

      if (s.id === 'products') {
        PRODUCTS.forEach(group => {
          const cat = document.createElement('div');
          cat.className = 'cat';
          cat.textContent = state.lang === 'kz' ? group.cat_kz : group.cat;
          menuEl.appendChild(cat);

          group.items.forEach(item => {
            const sub = document.createElement('a');
            sub.href = '#';
            sub.className = 'sub';
            sub.textContent = state.lang === 'kz' ? item.label_kz : item.label;
            sub.onclick = (e) => {
              e.preventDefault();
              state.sectionId = 'products';
              state.activeKey = `product||${item.label}`;
              render();
              setReplica(sectionTitle(currentSection()), sub.textContent, localizedText(item.text, item.label));
            };
            menuEl.appendChild(sub);
          });
        });
      }
    });
  }

  function renderProductsRibbon(){
    const ribbon = sectionContentEl.querySelector('#productRibbon');
    if (!ribbon) return;
    ribbon.innerHTML = '';

    PRODUCTS.forEach(group => {
      const seg = document.createElement('div');
      seg.className = 'productSegment';
      seg.innerHTML = `<div class="productSegmentTitle">${escapeHtml(state.lang === 'kz' ? group.cat_kz : group.cat)}</div><div class="btnGrid productLine"></div>`;
      const line = seg.querySelector('.productLine');

      group.items.filter(item => matchesSearch(`${item.label} ${localizedText(item.text, item.label)}`)).forEach(item => {
        const btn = document.createElement('button');
        btn.className = `chip ${item.color || 'gray'}`;
        btn.textContent = state.lang === 'kz' ? item.label_kz : item.label;
        btn.onclick = () => {
          state.activeKey = `product||${item.label}`;
          setReplica(sectionTitle(currentSection()), btn.textContent, localizedText(item.text, item.label));
        };
        line.appendChild(btn);
      });

      ribbon.appendChild(seg);
    });
  }


  function buildPricePromoTableHtml(lang='ru'){
    const isKz = lang === 'kz';
    const titleProduct = isKz ? 'Өнім атауы' : 'Название продукта';
    const titlePromo = isKz ? 'Науқан' : 'Акция';
    const titlePrice = isKz ? 'Баға' : 'Цена';
    const titleCondition = isKz ? 'Шарт' : 'Условие';
    const promoTableTitle = isKz ? 'Жаңа тауарлар (акциялар)' : 'Новые товары (акции)';
    const standardTableTitle = isKz ? 'Стандартты тауарлар' : 'Стандартные товары';
    const promoRows = PRODUCTS
      .flatMap(group => group.items.filter(item => item.isPromo))
      .map(item => `<tr><td>${escapeHtml(isKz ? (item.label_kz || item.label) : item.label)}</td><td>${escapeHtml(localizeMetaString(item.tablePromo || '', lang))}</td><td>${escapeHtml(localizeMetaString(item.tablePrice || '', lang))}</td></tr>`)
      .join('');
    const standardRows = PRODUCTS
      .flatMap(group => group.items.filter(item => !item.isPromo && group.cat !== 'ПОДАРОК НА ПОЧТУ'))
      .map(item => `<tr><td>${escapeHtml(isKz ? (item.label_kz || item.label) : item.label)}</td><td>${escapeHtml(localizeMetaString(item.tableCondition || (isKz ? 'Стандартты жеңілдік' : 'Стандартная льгота'), lang))}</td><td>${escapeHtml(localizeMetaString(item.tablePrice || '', lang))}</td></tr>`)
      .join('');
    const promoAttention = isKz
      ? `Жаңа тауарлар үшін акция 2+1 бойынша жүреді. Курьер тек мына қалаларға жеткізеді — <span class="cityListRed">Актау, Алматы, Кокшетау, Туркестан, Шымкент, Астана</span>. Пошта — Қазақстан бойынша.`
      : `Для новых товаров товары по акции идут 2+1. Обязательно проверяйте доставку: курьерская доставка доступна только по городам — <span class="cityListRed">Актау, Алматы, Кокшетау, Туркестан, Шымкент, Астана</span>. Почтовая доставка доступна по всему Казахстану.`;
    const standardAttention = isKz
      ? `Стандартты тауарлар үшін базалық схема қолданылады: баға 90 000 ₸, жеңілдік 50 000 ₸, жеке жеңілдік 3 000 ₸, қорытынды 37 000 ₸.`
      : `Для стандартных товаров действует базовая схема: цена 90 000 ₸, льгота 50 000 ₸, персональная скидка 3 000 ₸, итог 37 000 ₸.`;
    return `
      <div class="priceTableWrap">
        <div class="priceTableTitle">${promoTableTitle}</div>
        <table class="priceTable">
          <thead><tr><th>${titleProduct}</th><th>${titlePromo}</th><th>${titlePrice}</th></tr></thead>
          <tbody>${promoRows}</tbody>
        </table>
        <div class="priceAttention">${promoAttention}</div>
      </div>
      <div class="priceTableWrap">
        <div class="priceTableTitle">${standardTableTitle}</div>
        <table class="priceTable">
          <thead><tr><th>${titleProduct}</th><th>${titleCondition}</th><th>${titlePrice}</th></tr></thead>
          <tbody>${standardRows}</tbody>
        </table>
        <div class="priceAttention">${standardAttention}</div>
      </div>`;
  }

  function restoreActiveReplica(section){
    if (!state.activeKey || !section) return false;

    if (state.activeKey === `${section.id}||deliveryChooser`) {
      openDeliveryChooser(section);
      return true;
    }

    if (state.activeKey.startsWith(`${section.id}||deliveryOption||`)) {
      openDeliveryOption(section, state.activeKey.split('||')[2] || '');
      return true;
    }

    if (state.activeKey.startsWith('product||')) {
      const productKey = state.activeKey.split('||')[1];
      const item = PRODUCTS.flatMap(group => group.items).find(p => p.label === productKey);
      if (!item) return false;
      setReplica(sectionTitle(section), state.lang === 'kz' ? (item.label_kz || item.label) : item.label, localizedText(item.text, item.label));
      return true;
    }

    const parts = state.activeKey.split('||');
    const targetGrid = parts[1] === 'auto' ? null : parts[1];
    const targetLabel = parts[2] || parts[1] || '';
    const grids = section.buttonsByGrid || {};

    for (const [gridName, buttons] of Object.entries(grids)) {
      if (targetGrid && gridName !== targetGrid) continue;
      const idx = buttons.findIndex(btn => btn.label === targetLabel);
      if (idx === -1) continue;
      const btn = buttons[idx];
      const display = (section.id === 'objAfterPrice' && gridName.startsWith('obj'))
        ? `${idx + 1}. ${localizedLabel(btn)}`
        : localizedLabel(btn);
      setReplica(sectionTitle(section), display, localizedText(btn.text));
      return true;
    }

    return false;
  }

  function syncObjCategoryUI(section){
    if (!section || section.id !== 'objAfterPrice') return;

    const catMap = {
      cost:'objCost', doubts:'objDoubts', scam:'objScam', safety:'objSafety',
      silent:'objSilent', negative:'objNegative', assortment:'objAssortment', pensioners:'objPensioners'
    };

    sectionContentEl.querySelectorAll('[data-objcat]').forEach(tab => {
      const cat = tab.getAttribute('data-objcat');
      tab.classList.toggle('active', cat === state.objCategory);
      tab.onclick = () => {
        state.objCategory = cat;
        state.activeKey = null;
        renderSection();
      };
    });

    sectionContentEl.querySelectorAll('[data-objpanel]').forEach(panel => {
      panel.style.display = panel.getAttribute('data-objpanel') === state.objCategory ? '' : 'none';
    });

    sectionContentEl.querySelectorAll('[data-empty-for]').forEach(empty => {
      const gridName = empty.getAttribute('data-empty-for');
      const grid = sectionContentEl.querySelector(`[data-grid="${gridName}"]`);
      const visible = catMap[state.objCategory] === gridName && grid && !grid.children.length;
      empty.style.display = visible ? 'block' : 'none';
    });
  }

  function renderSection(){
    const s = currentSection();
    pageTitleEl.textContent = sectionTitle(s);
    quickAreaEl.innerHTML = '';
    sectionContentEl.innerHTML = localizedText(s.contentHtml);

    if (s.id === 'products') {
      renderProductsRibbon();
    }
    if (s.id === 'price') {
      const priceMount = sectionContentEl.querySelector('#priceTablesMount');
      if (priceMount) priceMount.innerHTML = buildPricePromoTableHtml(state.lang);
    }

    const grids = [...sectionContentEl.querySelectorAll('[data-grid]')];
    grids.forEach(gridEl => {
      const gridName = gridEl.getAttribute('data-grid');
      const list = (s.buttonsByGrid && s.buttonsByGrid[gridName]) ? s.buttonsByGrid[gridName] : [];
      gridEl.innerHTML = '';
      list
        .filter(btn => matchesSearch(`${localizedLabel(btn)} ${localizedText(btn.text)}`))
        .forEach((btn, idx) => {
          const display = (s.id === 'objAfterPrice' && gridName.startsWith('obj')) ? `${idx + 1}. ${localizedLabel(btn)}` : localizedLabel(btn);
          const b = document.createElement('button');
          b.className = `chip ${btn.color || 'gray'} ${display.length > 50 ? 'long' : ''}`;
          b.textContent = display;
          b.onclick = () => {
            if (btn.deliveryChooser) {
              openDeliveryChooser(s);
              return;
            }
            state.activeKey = `${s.id}||${gridName}||${btn.label}`;
            setReplica(sectionTitle(s), display, localizedText(btn.text));
            if (btn.goto) goToSection(btn.goto);
          };
          gridEl.appendChild(b);
        });
    });

    syncObjCategoryUI(s);

    const restoredReplica = restoreActiveReplica(s);

    if (!restoredReplica) {
      if (s.id === 'products') {
        const firstGroup = PRODUCTS.find(g => g.items.length);
        if (firstGroup) {
          const firstItem = firstGroup.items[0];
          setReplica(sectionTitle(s), state.lang === 'kz' ? firstItem.label_kz : firstItem.label, localizedText(firstItem.text, firstItem.label));
          state.activeKey = `product||${firstItem.label}`;
        } else {
          replicaTextEl.textContent = '—';
        }
      } else if (s.id === 'price' || s.id === 'checkout') {
        openDeliveryChooser(s);
      } else {
        const allButtons = Object.values(s.buttonsByGrid || {}).flat();
        const first = allButtons.find(btn => matchesSearch(`${localizedLabel(btn)} ${localizedText(btn.text)}`));
        if (first) {
          const display = localizedLabel(first);
          setReplica(sectionTitle(s), display, localizedText(first.text));
          state.activeKey = `${s.id}||auto||${first.label}`;
        } else {
          replicaMetaEl.textContent = `${sectionTitle(s)} → ${ui('replicaHint')}`;
          replicaTextEl.textContent = '—';
        }
      }
    }
  }

  function bindPrevNext(){
    const idx = FLOW.indexOf(state.sectionId);
    btnPrevEl.disabled = idx <= 0;
    btnNextEl.disabled = idx >= FLOW.length - 1;
    btnPrevEl.onclick = () => { if (idx > 0) goToSection(FLOW[idx - 1]); };
    btnNextEl.onclick = () => { if (idx < FLOW.length - 1) goToSection(FLOW[idx + 1]); };
  }

  function render(){
    renderTopUI();
    renderStagePills();
    renderMenu();
    renderSection();
    bindPrevNext();
  }

  document.getElementById('clientName').addEventListener('input', renderSection);
  document.getElementById('opName').addEventListener('input', renderSection);
  document.getElementById('search').addEventListener('input', (e) => {
    state.search = e.target.value;
    state.activeKey = null;
    renderSection();
  });
  btnLangEl.addEventListener('click', () => {
    state.lang = state.lang === 'ru' ? 'kz' : 'ru';
    state.search = '';
    document.getElementById('search').value = '';
    render();
    btnLangEl.blur();
  });

  render();
</script>
</body>
</html>
