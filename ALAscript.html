<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Электронный скрипт Даралтай</title>
  <style>
    :root{
      --bg:#f3f5f8;
      --panel:#ffffff;
      --border:#d9dee7;
      --text:#111827;
      --muted:#6b7280;
      --blue:#0ea5e9;
      --blue2:#0284c7;
      --greenBg:#24b35a;
      --redBg:#e24a4a;
      --grayBg:#6b7280;
      --teal:#06b6d4;
      --yellow:#f59e0b;
      --purple:#8b5cf6;
      --radius:10px;
      --shadow2: 0 6px 18px rgba(0,0,0,.06);
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial;
    }
    *{box-sizing:border-box}
    body{ margin:0; font-family:var(--sans); background:var(--bg); color:var(--text); }
    .app{ display:grid; grid-template-columns:1fr 340px; gap:18px; padding:16px; min-height:100vh; }
    .main{ min-width:0; }
    .sidebar{
      position:sticky; top:16px; height:calc(100vh - 32px); background:var(--panel);
      border:1px solid var(--border); box-shadow:var(--shadow2); overflow:hidden; display:flex; flex-direction:column;
    }
    .sbTop{ padding:14px; border-bottom:1px solid var(--border); }
    .sbTitle{ font-weight:700; font-size:14px; letter-spacing:.02em; margin:0 0 10px 0; text-transform:uppercase; }
    .inputs{ display:none; grid-template-columns:1fr 1fr; gap:10px; }
    .field label{ display:block; font-size:11px; color:var(--muted); font-weight:600; margin-bottom:4px; }
    .field input, .searchWrap input{
      width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px; outline:none; background:#fff; font-size:12px;
    }
    .field input:focus, .searchWrap input:focus{ border-color:rgba(14,165,233,.55); box-shadow:0 0 0 3px rgba(14,165,233,.12); }
    .searchWrap{ display:none; padding:12px 14px; border-bottom:1px solid var(--border); background:#fafbfd; }
    .menu{ overflow:auto; padding:10px; }
    .menu a{
      display:block; padding:10px 12px; margin:8px 6px; border:1px solid var(--border); background:#e9f5fb;
      color:#0f172a; font-weight:700; text-decoration:none; text-transform:uppercase; letter-spacing:.02em; font-size:12px;
    }
    .menu a.active{ background:var(--blue); border-color:var(--blue2); color:#fff; }
    .menu .cat{ margin:12px 8px 6px 8px; font-size:11px; color:var(--muted); font-weight:800; text-transform:uppercase; letter-spacing:.05em; }
    .menu a.sub{
      margin:0 6px 6px 18px; padding:8px 10px; font-size:11px; text-transform:none; letter-spacing:0;
      background:#f4fbff; border-left:4px solid rgba(14,165,233,.35); border-radius:8px; font-weight:700;
    }
    .page{ background:var(--panel); border:1px solid var(--border); box-shadow:var(--shadow2); padding:18px; }
    .pageTitle{ margin:0 0 14px 0; font-weight:800; text-transform:uppercase; letter-spacing:.04em; text-align:center; }
    .stageBar{ display:flex; flex-wrap:wrap; gap:10px; margin:0 0 14px 0; padding:12px; border:1px solid var(--border); background:#fbfdff; box-shadow:var(--shadow2); }
    .stageLeft{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-right:auto; }
    .stageRight{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    button.navBtn{
      border:none; cursor:pointer; padding:8px 10px; border-radius:8px; font-weight:700; font-size:13px;
      box-shadow:var(--shadow2); color:#fff; background:var(--grayBg); display:flex; gap:8px; align-items:center; white-space:nowrap;
    }
    button.navBtn.blue{ background:var(--blue); }
    button.navBtn.outline{ background:#fff; color:#0f172a; border:1px solid var(--border); }
    button.navBtn:disabled{ opacity:.55; cursor:default; }
    .stagePills{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    button.stagePill{
      border:1px solid var(--border); background:#fff; color:#0f172a; cursor:pointer; padding:7px 9px;
      border-radius:8px; font-weight:800; font-size:11px; text-transform:uppercase; letter-spacing:.03em;
    }
    button.stagePill.active{ background:var(--blue); color:#fff; border-color:var(--blue2); }
    #quickArea{ margin:0 0 14px 0; }
    .replicaBox{ border:2px solid rgba(14,165,233,.25); background:#f2fbff; padding:14px; box-shadow:var(--shadow2); margin:0 0 16px 0; }
    .replicaHead{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
    .replicaHead .label, .replicaHead .price{
      font-weight:900; font-size:12px; background:#fff; border:1px solid var(--border); padding:6px 10px;
    }
    .replicaHead .meta{ font-size:12px; color:var(--muted); font-weight:700; }
    .replicaText{ font-size:18px; line-height:1.55; font-weight:900; white-space:pre-wrap; word-wrap:break-word; margin:0; }

    .productReplicaFormatted{ white-space:normal; font-weight:700; display:flex; flex-direction:column; gap:18px; }
    .productReplicaParagraph{ margin:0; line-height:1.62; }
    .productReplicaMeta{ margin:0; line-height:1.56; font-weight:900; }
    .productReplicaHeader{ margin:0; padding:10px 14px; border-left:6px solid var(--yellow); background:rgba(245,158,11,.14); font-weight:900; text-transform:uppercase; letter-spacing:.03em; border-radius:12px; }
    .productReplicaQuestion{ margin:0; padding:18px 22px; border-left:8px solid #ef2f2f; background:#f4eef1; color:#e62f2f; font-weight:900; line-height:1.42; border-radius:18px; font-size:18px; box-shadow:0 2px 8px rgba(15,23,42,.04); }
    .productReplicaComment{ margin:0; padding:18px 22px; border:1px solid #d8dce5; background:#fbfbfc; border-radius:18px; line-height:1.56; font-weight:800; color:#111827; box-shadow:0 2px 8px rgba(15,23,42,.04); }
    .productReplicaCommentLabel{ display:block; margin:0 0 10px 0; color:#6b7280; font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.08em; }
    .productReplicaCommentBody{ display:block; line-height:1.56; }
    .replicaRedBold{ color:#dc2626; font-weight:900; }
    .replicaBold{ font-weight:900; }
    .tokenClient{ color:#ef4444; font-weight:900; }
    .banner{ padding:10px 12px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; margin:10px 0; display:block; border-left:6px solid transparent; }
    .banner.teal{ background:rgba(6,182,212,.18); border-left-color:var(--teal); }
    .banner.red{ background:rgba(239,68,68,.12); border-left-color:var(--redBg); }
    .banner.green{ background:rgba(34,197,94,.14); border-left-color:var(--greenBg); }
    .banner.yellow{ background:rgba(245,158,11,.14); border-left-color:var(--yellow); }
    .banner.purple{ background:rgba(139,92,246,.12); border-left-color:var(--purple); }
    .textBlock{ font-size:15px; line-height:1.6; margin:10px 0; font-weight:500; }
    .addressPromptBlock{ margin-bottom:6px; }
    .btnGrid{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
    button.chip{
      border:none; padding:10px 12px; font-weight:800; font-size:14px; color:#fff; cursor:pointer; box-shadow:var(--shadow2);
      border-radius:10px; text-align:left; max-width:100%;
    }
    .chip.green{ background:var(--greenBg); }
    .chip.red{ background:var(--redBg); }
    .chip.gray{ background:var(--grayBg); }
    .chip.blue{ background:var(--blue); }
    .chip.purple{ background:var(--purple); }
    .chip.active{ outline:4px solid rgba(14,165,233,.18); }
    .replicaDeliveryLead{ margin:0 0 14px 0; font-size:18px; line-height:1.55; font-weight:900; }
    .replicaDeliveryButtons{ margin:0 0 14px 0; }
    .replicaDeliveryButtons .chip{ white-space:normal; }
    .replicaDeliveryContent{ margin-top:8px; }
    .replicaDeliveryPlaceholder{ font-size:16px; line-height:1.55; font-weight:800; color:#475569; }
    .chip.long{ flex:1 1 520px; }

    .productRibbonHint{ margin:0 0 10px 0; font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    .productRibbonWrap{ border:1px solid var(--border); background:#fbfdff; box-shadow:var(--shadow2); padding:12px; overflow:hidden; }
    .productRibbon{ display:flex; flex-wrap:nowrap; gap:12px; overflow-x:auto; padding-bottom:4px; scroll-snap-type:x proximity; }
    .productSegment{ flex:0 0 auto; min-width:max-content; border:1px solid var(--border); background:#fff; border-radius:10px; padding:10px; box-shadow:var(--shadow2); scroll-snap-align:start; }
    .productSegmentTitle{ margin:0 0 8px 0; font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); white-space:nowrap; }
    .productLine{ display:flex; flex-wrap:nowrap; gap:8px; margin-top:0; overflow-x:auto; padding-bottom:2px; }
    .productLine .chip{ flex:0 0 auto; white-space:nowrap; font-size:12px; padding:8px 10px; border-radius:8px; }
    .objSwitchboard{ border:1px solid var(--border); background:#fff; box-shadow:var(--shadow2); padding:12px; margin:12px 0; }
    .objWorkspace{ display:grid; grid-template-columns:220px minmax(0,1fr); gap:12px; align-items:start; }
    .objTabs{ display:flex; flex-direction:column; gap:8px; margin:0; position:sticky; top:12px; align-self:start; }
    .objTab{
      width:100%; text-align:left;
      border:1px solid var(--border); background:#fff; color:#0f172a; border-radius:10px; padding:10px 12px; cursor:pointer;
      font-weight:900; font-size:12px; text-transform:uppercase; letter-spacing:.03em;
    }
    .objTab.active{ background:var(--blue); color:#fff; border-color:var(--blue2); box-shadow:var(--shadow2); }
    .objPanels{ min-width:0; }
    .objPanel{ border:1px solid var(--border); background:#fff; box-shadow:var(--shadow2); padding:14px; }
    .objPanelTitle{ margin:0 0 10px 0; font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    .objPanel .btnGrid{ gap:8px; margin-top:0; }
    .objPanel .chip{ flex:1 1 260px; padding:9px 11px; font-size:13px; }
    .objEmpty{ display:none; margin-top:8px; padding:10px 12px; border:1px dashed var(--border); border-radius:8px; background:#fafbfd; color:var(--muted); font-weight:700; }

    .cityListRed{ color:#dc2626; font-weight:900; }
    .menuDeliveryNote{ color:#dc2626; font-weight:900; }
    .productBtnLabel{ display:block; }
    .productBtnNote{ display:block; margin-top:4px; font-size:11px; line-height:1.35; font-weight:900; color:#dc2626; text-transform:none; }
    .priceTableWrap{ border:1px solid var(--border); background:#fff; box-shadow:var(--shadow2); padding:12px; margin:12px 0; border-radius:10px; }
    .priceTableTitle{ margin:0 0 8px 0; font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    .priceTable{ width:100%; border-collapse:collapse; font-size:12px; background:#fff; }
    .priceTable th, .priceTable td{ border:1px solid var(--border); padding:8px 10px; text-align:left; vertical-align:top; }
    .priceTable th{ background:#f8fafc; font-weight:900; text-transform:uppercase; letter-spacing:.03em; font-size:11px; }
    .priceAttention{ margin-top:10px; padding:10px 12px; border:1px solid rgba(220,38,38,.22); background:rgba(220,38,38,.06); border-radius:8px; font-size:12px; font-weight:800; line-height:1.5; }

    @media (max-width:900px){
      .objWorkspace{ grid-template-columns:1fr; }
      .objTabs{ position:static; flex-direction:row; flex-wrap:wrap; }
      .objTab{ width:auto; flex:1 1 180px; }
      .objPanel .chip{ flex:1 1 100%; }
    }
    @media (max-width:1100px){ .app{ grid-template-columns:1fr; } .sidebar{ position:relative; height:auto; } }

    /* Delivery checker */
    .deliveryCheck{ margin:-4px 0 12px 0; padding:0; max-width:460px; clear:both; }
    .deliveryCheckRow{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:5px; align-items:center; position:relative; }
    .deliveryCheckInputWrap{ position:relative; min-width:0; }
    .deliveryCheckInput{ width:100%; height:30px; padding:5px 8px; border:1px solid #d7e3ef; border-radius:8px; outline:none; font:inherit; font-size:11px; background:#fff; transition:border-color .15s ease, box-shadow .15s ease; }
    .deliveryCheckInput:focus{ border-color:rgba(14,165,233,.55); box-shadow:0 0 0 3px rgba(14,165,233,.10); }
    .deliveryCheckBtn{ border:none; cursor:pointer; height:30px; padding:5px 9px; border-radius:8px; font-weight:800; font-size:10px; color:#fff; background:linear-gradient(135deg,var(--blue) 0%,var(--blue2) 100%); }
    .deliveryCheckResult{ display:flex; flex-wrap:wrap; gap:4px; margin-top:3px; min-height:0; }
    .deliveryCheckPill{ display:inline-flex; align-items:center; justify-content:center; padding:5px 9px; border-radius:999px; font-size:10px; font-weight:800; border:1px solid #dbe5ef; background:#fff; color:#0f172a; }
    .deliveryCheckPill.ok{ background:#ecfdf5; border-color:#bbf7d0; color:#166534; }
    .deliveryCheckPill.post{ background:#eff6ff; border-color:#bfdbfe; color:#1d4ed8; }
    .deliveryCheckPill.warn{ background:#fff7ed; border-color:#fed7aa; color:#9a3412; }
    .deliveryCheckAc{ position:static; margin-top:4px; width:100%; background:#fff; border:1px solid #dbe5ef; border-radius:10px; box-shadow:0 8px 18px rgba(15,23,42,.08); overflow:hidden; max-height:220px; overflow:auto; display:none; z-index:5; }
    .deliveryCheckAcItem{ padding:7px 9px; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:11px; }
    .deliveryCheckAcItem:hover, .deliveryCheckAcItem.active{ background:#f3f7fb; }
    .deliveryCheckAcMeta{ margin-left:auto; font-size:11px; color:#64748b; white-space:nowrap; }
    .deliveryCheckMark{ background:#fffbcc; border-radius:4px; padding:0 2px; }
    .replicaActions{ display:none; justify-content:flex-end; margin-top:14px; }
    .replicaTopBtn{ border:1px solid var(--border); background:#fff; color:#0f172a; border-radius:999px; padding:8px 12px; font-weight:800; font-size:12px; cursor:pointer; box-shadow:var(--shadow2); }
    .replicaTopBtn:hover{ background:#f8fafc; }
    @media (max-width:700px){ .deliveryCheck{ max-width:100%; } .deliveryCheckRow{ grid-template-columns:minmax(0,1fr) auto; } .deliveryCheckBtn{ width:auto; } }

  </style>
</head>
<body>
<div class="app">
  <div class="main">
    <div class="page">
      <h1 class="pageTitle" id="pageTitle">ПРИВЕТСТВИЕ</h1>

      <div class="stageBar">
        <div class="stageLeft">
          <button class="navBtn" id="btnPrev">← Назад</button>
          <button class="navBtn blue" id="btnNext">Далее →</button>
        </div>
        <div class="stageRight">
          <button class="navBtn outline" id="btnLang">RU → KZ</button>
          <div class="stagePills" id="stagePills"></div>
        </div>
      </div>

      <div id="quickArea"></div>

      <div class="replicaBox" id="replicaBox">
        <div class="replicaHead">
          <div class="label" id="replicaLabel">Реплика (читать оператору)</div>
          <div class="meta" id="replicaMeta">Нажмите кнопку — реплика появится здесь</div>
          <div class="price" id="pricePill"></div>
        </div>
        <img id="replicaImg" alt="Фото товара" style="display:none; width:100%; max-height:220px; object-fit:contain; border:1px solid var(--border); background:#fff; margin:10px 0; padding:6px;" />
        <div class="replicaText" id="replicaText">—</div>
        <div class="replicaActions" id="replicaActions">
          <button type="button" class="replicaTopBtn" id="replicaBackTopBtn">↑ Наверх</button>
        </div>
      </div>

      <div id="sectionContent"></div>
    </div>
  </div>

  <aside class="sidebar">
    <div class="sbTop">
      <div class="sbTitle" id="sbTitle">Скрипт • меню</div>
      <div class="inputs">
        <div class="field">
          <label id="lblClient">Имя клиента</label>
          <input id="clientName" placeholder="Напр.: Айгуль" />
        </div>
        <div class="field">
          <label id="lblOp">Имя оператора</label>
          <input id="opName" placeholder="Напр.: Алина" />
        </div>
      </div>
    </div>
    <div class="searchWrap">
      <input id="search" placeholder="Поиск по кнопкам..." />
    </div>
    <div class="menu" id="menu"></div>
  </aside>
</div>

<script>
  const PRICING = { base: 90000, benefit: 50000, extraDiscount: 3000, final: 37000 };
  const fmt = (n)=> new Intl.NumberFormat('ru-RU').format(n);

  const UI = {
    ru: {
      appMenu:'Скрипт • меню', clientLabel:'Имя клиента', opLabel:'Имя оператора', clientPh:'Напр.: Айгуль', opPh:'Напр.: Алина',
      searchPh:'Поиск по кнопкам...', prev:'← Назад', next:'Далее →', langBtn:'RU → KZ', langBtnBack:'KZ → RU',
      replicaLabel:'Реплика (читать оператору)', replicaHint:'Нажмите кнопку — реплика появится здесь', backToTop:'↑ Наверх',
      pricePill:(base, benefit, extraDiscount, final)=>`Цена: ${fmt(base)} ₸ • Льгота: ${fmt(benefit)} ₸ • Персональная скидка: ${fmt(extraDiscount)} ₸ • Итог: ${fmt(final)} ₸`
    },
    kz: {
      appMenu:'Скрипт • мәзір', clientLabel:'Клиенттің аты', opLabel:'Оператордың аты-жөні', clientPh:'Мыс.: Айгүл', opPh:'Мыс.: Алина',
      searchPh:'Батырмалар бойынша іздеу...', prev:'← Артқа', next:'Келесі →', langBtn:'RU → KZ', langBtnBack:'KZ → RU',
      replicaLabel:'Сөйлем (оператор оқиды)', replicaHint:'Батырманы басыңыз — мәтін осында шығады', backToTop:'↑ Жоғары',
      pricePill:(base, benefit, extraDiscount, final)=>`Баға: ${fmt(base)} ₸ • Жеңілдік: ${fmt(benefit)} ₸ • Жеке жеңілдік: ${fmt(extraDiscount)} ₸ • Қорытынды: ${fmt(final)} ₸`
    }
  };

  const TEXT = {
    ru: {
      hello_start:`Добрый день, это {Имя клиента}? (Ждём ответа)

Очень приятно. Это (Имя Отчество оператора), старший эксперт центра "Даралтай".

{Имя клиента}, Наша компания "Даралтай" одобрила Вам индивидуальную программу на восстановление здоровья. Я Вас с этим Поздравляю! Эта программа направлена на улучшение и профилактику Вашего здоровья и предоставляется всего лишь один раз в год.

{Имя клиента}, буквально пару минут Вашего времени, я задам несколько уточняющих вопросов по здоровью.

(Без паузы переходим к выявлению потребностей)`,
      hello_obj:`Быстрые ответы на первые вопросы и сомнения клиента.`,
      needs_general:`1) {Имя клиента}, сколько вам полных лет?
2) {Имя клиента}, как Вы сейчас в целом себя чувствуете? Что беспокоит больше всего?
3) Что принимаете для поддержки здоровья на постоянной основе?`,
      needs_if_ok:`Если клиент говорит «у меня всё хорошо»: {Имя клиента}, как раз поэтому я Вам и звоню. Лично на Ваше имя уже одобрена льготная программа “Здоровая нация” - и под мою личную ответственность она включает восстановление сосудов, ЖКТ, зрения, суставов, безопасное похудение (Если мужчина - и даже мужского здоровья). 

 

Видите в чём дело, после пандемии коронавируса во всём мире, включая Казахстан и другие страны, действительно отмечается рост проблемы с сердечно-сосудистой системой, склонность к тромбозам - даже у молодых и ранее здоровых людей! Частые проблемы с суставами и мочеиспускательной системой.  У большей части населения наблюдается снижение иммунитета и рост хронических заболеваний. Перенесённая инфекция могла «расшатать» иммунную систему, что привело к обострению гипертонии, сахарного диабета, аутоиммунных заболеваний, и самое главное - ухудшение работы головного мозга! Подскажите, пожалуйста, как обстоят дела со сном, нервной системой, частые простудные заболевания беспокоят? `,
      needs_hard_refusal:`Если категорически отказывается: {Имя клиента}, понимаю. замечательно, что на сегодняшний день у Вас нет жалоб по здоровью - это действительно редкость, и я искренне рад(а) это слышать! Как раз по этой причине и звоню - Вам уже одобрена льготная программа, и сейчас как раз есть возможность поддержать организм заранее, чтобы в будущем не столкнуться с неприятностями. Согласитесь, в наше время не так просто попасть под льготы, правда? `,

    "cost_expensive": "1-нұсқа\n\nТүсінемін, {Имя клиента}, қазір қиын кезеңде бәрі ақшасын есеппен жұмсауға тырысады. Бірақ ең бастысы — денсаулық пен күш-қуат, солай емес пе? (жауап күтеміз) Айырмашылықты Сіз алғашқы күндерден-ақ байқайсыз: күш пайда болады, қуат артады, ұйқы түзеледі, ағза іштен қауіпсіз түрде қалпына келе бастайды. Ең маңыздысы — нәтиже ұзаққа бекітіледі, сондықтан симптомды ғана жасыратын химиялық дәрілерді қайта-қайта іздеп жүрмейсіз.\n\nЖеңілдік бағдарламасының арқасында Сіз ағзаны қалпына келтіруге және нығайтуға көмектесетін құралды шартты түрде шағын төлеммен ала аласыз, өйткені негізгі соманың көп бөлігін біз жабамыз, ал Сізден аз ғана үстеме төлем қалады.\n\n{Имя клиента}, тапсырысты рәсімдейміз бе?\n\n2-нұсқа\n\n{Имя клиента}, Сізді толық түсінемін, баға әрқашан маңызды. Бірақ денсаулық жайлы сөз болғанда, тауардың өзі емес, нәтижесі маңыздырақ: хал-жағдай жақсарсын, жеңілдік сезімі, қуат пен сенімділік қайтсын. Жақсы құралдың тым арзан болмайтынын өзіңіз де түсінесіз ғой. Егер оны дәріханадағы жаппай сатылатын өнімдермен салыстырсақ, біздің баға жоғарырақ көрінуі мүмкін. Бірақ ол жақта Сіз көбіне синтетикалық қоспаларға, агрессивті консерванттарға және бренд үшін маркетингтік үстемеге ақша төлейсіз. Ал біз таза құрамға және дәлелденген тиімділікке басымдық береміз. Бұл органикалық өнімді фастфудтан таңдағанмен бірдей — сапа айырмашылығы бірден білінеді.\n\nҚазір Сізде жеңілдікті пайдаланып, шынымен (клиенттің мәселесін атаңыз) қалпына келтіруге көмектесетін курсты алу мүмкіндігі бар. Таза үнеміңіз 12 000 теңгеден асады!\n\n{Имя клиента}, тапсырысты рәсімдеп, қалпына келуді бастаймыз ба?\n\n3-нұсқа\n\n{Имя клиента}, Сіз денсаулықты қалпына келтіру мен қолдауға арналған жеңілдік бағдарламасын пайдалана аласыз. Осындай кешендер дәріханаларда 56–80 мың теңге аралығында тұрады, бізде стандартты баға — 90 000 теңге, ал Сіздің жеңілдікпен бар болғаны 37 000 теңге шығады. Оның үстіне жеткізу тегін, алдын ала төлем жоқ, төлем тек алған кезде жа     "cost_pharmacy": "1-нұсқа\n\n{Имя клиента}, әрине, бұл — Сіздің таңдауыңыз, және мұндай шешімді тек өзіңіз қабылдайсыз. Бірақ қазіргі заманда денсаулықты қолдауға арналған құрал түрі өте көп, әр адам өзіне лайық нұсқаны таба алады. Біздің елде, жалпы алғанда, дәрі-дәрмек тапшылығы жоқ. Дәріханада кез келген ауруға арналған дәрі бар. Бірақ соған қарамастан, дәріхана сөрелері толып тұрса да, дені сау адамдар көбейіп кеткен жоқ.\n\n2-нұсқа\n\n{Имя клиента}, бұл расында Сіздің таңдауыңыз. Дегенмен, фармакологиялық бизнес — күн сайын миллиардтаған ақша айналатын сала екенін ұмытпаған жөн. Дәрілер анықтамалығын ашып, көрсетілімі мен қарсы көрсетілімін оқып көрсеңіз, олардың екіжақты әсеріне көз жеткізесіз: бірін емдейді, екіншісіне зиян тигізеді.\n\nНативті өнімдер олардың ішінде құрамына деген ерекше көзқарасымен ерекшеленеді: ішінде тек табиғи компоненттер бар, химиялық және фармакологиялық заттар қосылмайды. Бұл созылмалы аурулардың даму қаупін азайтуға және өмір сапасын жақсартуға ықпал етеді. Нативті құралдар клиникалық зерттеулерде жақсы нәтиже көрсеткен, ал клиенттердің пікірлері олардың тиімділігін растайды.\n\nРәсімдейміз бе?",
    "cost_cheaper": "Басқа жерден сатып алған кезде қауіпсіздік пен сапаға қатысты тәуекелді өзіңіз мойныңызға аласыз. Біз нарықта 11 жылдан астам жұмыс істеп келеміз, сенімді әрі тұрақты серіктес ретінде бедел қалыптастырдық, барлық құралдар декларациядан өткен және сапа бақылауының барлық кезеңінен бірнеше рет өтеді. Ал қазір жеңілдік бағдарламасының арқасында сатып алудың негізгі бөлігін біз жабамыз, ал Сіз тек аз ғана бөлігін төлейсіз. Яғни, Сіз ең төмен бағаға барынша жақсы сапаға кепілдікпен қол жеткізесіз.\n\nТапсырысты рәсімдейміз бе?",
    "cost_marketplace_health": "Бұл — менің ең сүйікті сұрағым (күлімсіреп айтамыз).\n\nМаркетплейстерде бастапқыда барлық пікірлер тамаша, бәрі 5 жұлдыз қойып тұратынын байқамадыңыз ба? Ал біраз уақыттан кейін «бос нәрсе алыппыз, көмектеспейді» деп жазған көңілі қалған адамдар шыға бастайды. Әрине, ақшаңызды борға ұқсас бос өнімге жұмсауыңызға болады, тек жағдай одан сайын ушықпаса болғаны. Ал Сіз арзанырақ нұсқа іздеп жүрген уақытта, есіңізде болсын: мәселе орнында тұрмайды.\n\n{Имя клиента}, бір нәрсені түсініңізші: біздің құрал — ресми, сертификатталған, табиғи компоненттері бар және сапасына кепілдік берілетін өнім. Маркетплейсте мұндайға ешкім нақты жауап бермейді, сол жерде «қаптағы мысықты» аласыз. Сондықтан бағадағы айырмашылық та осында: бізде Сіз тексерілген, қауіпсіз, жауап берілетін өнім аласыз.\n\nМәселеңізбен қоштасуға дайынсыз ба? Мен мекенжайыңызды жазып алайын, алушы өзіңіз боласыз ба?",
    "doubts_later_full": "Шынын айтайықшы, Сіз кейін тапсырыс бермейсіз. Өйткені әр адамның ай сайын бітпейтін шығыны бар: тоңазытқыш бұзылады, есік ауыстыру керек, көлік істен шығады, балаларға, немерелерге, жұбайға сыйлық алу керек — мұның тізімі шексіз. Сондықтан денсаулықты тағы да кейінге ысырасыз, үйге, отбасыға, жақындарыңызға көңіл бөлесіз, бірақ өзіңізге емес. Солай емес пе?\n\nАйтыңызшы, өтінемін, қазір шешім қабылдауға нақты не кедергі болып тұр? (жауап күтеміз)\n\nЕгер «ақша жоқ / бюджет шектеулі» десе:\nОнда нақтылайын: баға Сізге жайлы болса, қазір рәсімдер ме едіңіз? (жауап күтеміз) Мәселе мынада: баға өсіп жатыр, шикізат қымбаттап жатыр, логистика қымбат, шарттар өзгеріп тұрады. Баға көтерілсе, бұл нұсқаны енді қарамайтыныңызды өзіміз де түсініп тұрмыз. Сондықтан тиімді шартты дәл қазір бекітіп алған дұрыс.\n\nРәсімдейміз бе?\n\nЕгер «дайын емеспін / күмәнім бар» десе:\nМән-жайды нақты түсінгім келеді. Біз көбіне бәрін «кейінге» ысырамыз: дүйсенбіден спортзал, Жаңа жылдан диета... бірақ нәтижесінде ештеңе өзгермейді. Мүмкін, мінсіз сәтті күтпей, дәл қазір мүмкіндікті пайдалану керек шығар. Нақты не ұстап тұр? (жауап күтеміз)\n\nЕгер «жай кейінірек» десе:\nСіз үшін «кейінірек» нақты қашан? (егер нақты күн айтпаса) Онда шынын айтайық: ыңғайлы сәт мүлде болмауы мүмкін, ал қазіргі шарт болашақтағыдан бәрібір тиімдірек. Сондықтан кейінге қалдырмай, қазір рәсімдеген дұрыс.\n\nҚай курсты рәсімдейміз?\n\nҚорытынды жабу:\n{Имя клиента}, шешім әрине өзіңізде. Мен тек дәл бүгін, дәл осы Сізге берілген тиімді шарттармен денсаулықты қауіпсіз әрі ұтымды түрде қалпына келтіру мүмкіндігін ұсынып отырмын.\n\nРәсімдейміз бе?",
    "doubts_order_later": "Кейін де болады, бірақ бір маңызды нюанс бар: өзіңіз де түсінесіз, күн сайын бәрі қымбаттап жатыр — шикізат та, жеткізу де, жалпы баға да. Сондықтан дәл қазір тиімді шартты пайдаланып қалған дұрыс. Екеуміз де түсінеміз: жеңілдік болмаса, бұл тапсырысты қарамайсыз. Сол себепті мүмкіндікті жіберіп алмаңыз, уақыт жоғалтпайық, тапсырысты рәсімдейік.",
    "doubts_think_health": "«Ойланып көремін» деген сөздің артында не тұрғанын түсіну үшін мына сұрақтарды қолдануға болады.\n\n(БІРЕУІН ТАҢДАЙМЫЗ, БӘРІН ҚАТАР ОҚЫМАЙМЫЗ):\n\n1. Егер шешімді кейінге қалдырсаңыз, жағдай өздігінен өзгермейді ғой, солай ма? Тағы бір апта, бір ай бәрін сол күйі қалдыруға дайынсыз ба? Шынын айтқанда, осы мәселемен қанша уақыттан бері жүрсіз? Тағы қанша күткіңіз келеді?\n\nТүсіндірме: {Имя клиента}, ашық айтайықшы, егер қазір ештеңе өзгертпесек, бір аптадан, бір айдан кейін жағдайыңызға бұл қалай әсер етеді? Тағы ұзақ уақыт осымен жүруге дайынсыз ба? (жауап күтеміз) Мүмкін, шешім қабылдайтын уақыт келген шығар? Бұл мәселе Сізде әлдеқашаннан бері бар, әлі қанша ойланасыз?\n\n2. Ашық айтсақ, Сізге шынымен ойлануға уақыт керек пе, әлде бұл менімен сөйлесуден немесе мәселенің өзінен алыстаудың амалы ма?\n\nТүсіндірме: Мен Сізді түсінемін. Уақытты бос жібермегеніміз маңызды. Егер қазір жай ғана қысымсыз үзіліс жасағыңыз келсе, солай да айта аласыз. Ал нақты сұрақтар мазалап тұрса, дәл қазір соны бірге шешейік. Бас тартуға Сіз әрқашан үлгересіз, шешім өзіңізде. Бірақ мен оны ұсынбас едім, өйткені екінші рет кеш болуы мүмкін.\n\n3. Бұрын Сізге қажет, пайдалы бір затты алуды кейінге қалдырып, кейін «ертерек алсам ғой» деп өкінген кезіңіз болды ма?\n\nТүсіндірме: Көп клиентімізде дәл сондай оқиға болған. «Күте тұрайын» деген, кейін «бекер созыппын, мәселені баяғыда шешуге болатын еді» деген. Сіздің жағдайыңызда да солай болуы мүмкін деп ойламайсыз ба? (жауап күтеміз)\n\n4. Өзіңізге «иә, дайынмын» деу үшін не өзгеруі керек?\n\nТүсіндірме: {Имя клиента}, мен қысым жасау үшін емес, көмектесу үшін жанымдамын. Нәтиже алсаңыз, бізді таныстарыңызға айтып жүресіз ғой? Біз дәл солай жұмыс істейміз: нәтижеге және ұсынысқа.\n\n5. «Ойланып көремін» дегенде, Сіз пайдасын таразылап көргіңіз келе ме, әлде дәл қазір қажет-қажет емесін шешіп көргіңіз келе ме?\n\nТүсіндірме: Адал жауабыңызға рақмет. Көбіне адам «ойланамын» дегенде, негізі шешімін ішінен қабылдап қояды, тек күмәнданады. Ал денсаулық — кейінге ысырып қоятын теледидар емес. Мұнда сұрақ біреу ғана: Сіз өзіңізді қазір жақсартқыңыз келе ме, әлде жағдай ушыға түскенше күте бересіз бе? Мен асықтырмаймын. Бірақ егер өнім расында көмектессе және оның керегін түсініп тұрсаңыз, созудың мәні бар ма?\n\n6. Мәселе ушығып кеткенше шешімді тағы қанша уақытқа кейінге қалдыруға дайынсыз?\n\nТүсіндірме: Сіздің жағдайыңыз шешімді қажет етеді. Сұрақ тек біреу: оны қазір шешкіңіз келе ме, әлде кейін қиындап, қымбаттағанда ма? Бүгіннен бастап жағдайды өз қолыңызға алған дұрыс.\n\n7. Егер бұл мәселені қазір шешпесек, бір айдан кейін оңайырақ бола ма, әлде қиынырақ па?\n\nТүсіндірме: {Имя клиента}, шынын айтқанда, оңай болмайды. Көбіне созған сайын қымбатқа түседі. Бір айдан кейін өкінбейсіз дейтін қадамды дәл қазір бірге жасайық па?\n\n8. Көп клиентімізде дәл осылай болды: әуелі күмәнданды, ойланды, кейінге қалдырды. Ал соңында «бұрын шешім қабылдасам ғой» деп өкініп келді. Мен Сізде де солай болғанын қаламаймын.\n\nТүсіндірме: Мен тек ескертіп отырмын — кейінге қалдырғандар кейін уақыт жоғалтқанына өкінді. Сіз де сондай жағдайда қалғыңыз келмейді ғой? Онда кейін өкініш болмайтын шешімді бірге қабылдайық.\n\nҚорытынды: {Имя клиента}, ойланатын уақыт сәл ертерек болған. Себебі бұл мәселе Сізде біраз уақыттан бері бар, бірақ әлі толық шешілмеген. Енді ұзақ ойланатын емес, шешім қабылдайтын сәт келді.\n\nКурсты рәсімдейік, {Имя клиента}, нәтиже өзін көп күттірмейді деп уәде беремін.",
    "doubts_guarantees": "Тәжірибеде клиенттер сенімділік туралы сұрағанда, көбіне біздің жұмыс тәжірибемізді меңзейді: біз 2014 жылдан бері жұмыс істейміз, клиенттердің пікірі бар, тәжірибе бар. Өз тарапымыздан біз сапа кепілдігін беруге дайынбыз. Бізде барлық қажетті құжаттар бар. Өнім зерттеу нәтижелері бойынша сәйкестік декларациясынан өткен.",
    "doubts_bought_before": "Сезіміңізді түсінемін. Өкінішке қарай, әрдайым сенімді сатушылар кездесе бермейді. Өзімде де ондай жағдай болған. {Имя клиента}, мен бұл салада 10 жылдан астам жұмыс істеймін, және дәл Сіздің жағдайыңызға қажет дозаны жеке есептеп беремін, бәріне бірдей ортақ нәрсе ұсынбаймын. Мен үшін ӘРБІР клиент қымбат, еш ерекшеліксіз. Сіз расымен біз Сізге сондай нәрсе жіберіп, кейін Сіз бізбен байланысуды тоқтатасыз деп ойлайсыз ба? Әрине, ЖОҚ! Бұл бізге тиімді емес. Керісінше, біз әрдайым Сіз сияқты клиенттер нәтижеге риза болып, бізді есте сақтап, жақындарына ұсынғанын қалаймыз. Сондықтан бүгін ең жақсы құралдар дәл Сіз үшін. Сіз бұған әбден лайықсыз. Кейін өзіңіз де күмәнданғаныңызға күліп жүретін боласыз!\n\nТапсырысты рәсімдейміз бе?",
    "doubts_not_help": "{Имя клиента}, (өнім атауы) сапа бақылауының барлық қажетті кезеңінен өтті және өзінің тиімділігін дәлелдеді. Сіз өзіңізді ғана осындай жағдайдамын деп ойлайсыз ба? Әрине, жоқ. Бұл құралды (клиенттің мәселесін атаңыз) қалпына келтіру, нығайту және денсаулықты қолдау үшін көп адам қолданады. Сіз қайтадан толыққанды өмір сүргіңіз келеді ғой? Әрине, қалайсыз. Ал (өнім атауы) бұл мәселені ұзақ уақытқа шешуге көмектеседі. Оның үстіне Сіздің жағдайда курс 90 000 теңге тұрады, ал жеңілдікпен бар болғаны 37 000 теңге болады. Осындай мүмкіндікті жіберіп алу өкінішті емес пе? (жауап күтеміз)\n\n(Өнім атауы) әлемдегі (мәселені атаңыз) қалпына келтіруге арналған ең үздік 5 құралдың қатарына кіреді, ал Қазақстанда ол жалғыз. Мен Сізге жетекші маман ретінде қоңырау шалып, тек құжаттары бар, тексерілген құралдарды ұсынып отырмын. Сондықтан дені сау адамның толыққанды өміріне қайта оралу мүмкіндігін жіберіп алмаңыз.\n\nТапсырысты рәсімдейміз бе?",
    "doubts_never_heard": "Мүмкін, Сіз жай ғана ұмытып қалған шығарсыз. Бұл қалыпты жағдай. Біздің орталық 11 жылдан астам уақыттан бері жұмыс істейді, және клиенттердің басым бөлігімен әңгімеміз дәл осындай сөзден басталады. Ендеше, теориямен емес, нәтижемен бағалайық. Өнімнің әсерін сырттай бағалау мүмкін емес, оны көру үшін қабылдауды бастау керек. Тапсырыс беріп көріңіз, өкінбейсіз.\n\nТапсырысты рәсімдейміз бе?",
    "doubts_doctor": "Сіз маған сенбей тұрсыз ба?\n\nӘрине, әр адам өзі сенетін маманмен ақылдасқысы келеді, оны түсінемін. Бірақ бұл жерде дәрігердің әдеттегі ресми сөзін күту дұрыс болмауы мүмкін. Өйткені көп жағдайда дәрігер емделіп кеткеніңіз үшін емес, қабылдау үшін ақы алады, ал жүйенің өзі көбіне қаржы айналымына тәуелді. Соның салдарынан кейде тиімсіз нәрсені ұзақ ұсынып, дозасын қайта-қайта көтере береді.\n\nАл біздің жағдайда Сіз тиімділігі мен қауіпсіздігі дәлелденген құрал алып отырсыз. Оның үстіне дәл қазір Сізде денсаулықты қалпына келтіруге көмектесетін құралды тиімді шартпен алу мүмкіндігі бар.\n\nДұрыс па?\n\nТапсырысты рәсімдейміз бе?",
    "doubts_family": "Егер құпия болмаса, жұбайыңыздан қандай жауап күтіп отырсыз? (жауап күтеміз) Бүгін үнемдеу мүмкіндігі тұрғанда, ертең көбірек ақша жұмсауға қарсы болады деп ойламаймын.\n\nЕгер шешімді дәл қазір қабылдасаңыз, Сіз қысқа уақыт ішінде және денсаулыққа қауіпсіз түрде… (клиенттің мәселесін атаңыз) қалпына келтіруді бастайсыз.\n\nРәсімдейміз бе?",
    "scam_you": "Сақ болғаныңыз өте дұрыс! Қазіргі интернет пен сан түрлі онлайн-дүкендердің заманында алаяқтық расында көп, сондықтан мұқият болғаныңыз құптарлық. Мен Сізді өте жақсы түсінемін. Бірақ біз қайта сататын интернет-дүкен емеспіз. Біз — өндірушінің ресми өкіліміз, «Даралтай» орталығы, «Салауатты ұлт» бағдарламасы аясында жұмыс істейміз. 11 жылдан астам уақыттан бері жұмыс істеп, сенімді әрі тұрақты серіктес ретінде танылдық. Барлық өнім бірнеше рет тексеріледі: алдымен қоймаға түскенде, содан кейін тікелей Сізге жіберілер алдында. Сенімді түрде айта аламын: нәтижесін сезгеннен кейін, Сіз бізге көп клиентіміз сияқты алғыс айтып хабарласасыз. Сіз өз мәселеңізді әлдеқашан шешкіңіз келіп жүрген жоқсыз ба?\n\nТапсырысты рәсімдейміз бе?",
    "scam_nothing": "Мен Сіздің күмәніңізді түсінемін, бірақ менің мақсатым — бірдеңені күштеп өткізу емес. Мен тек осы айда Сіз және тағы бір адам пайдалана алатын жеңілдік бағдарламасы туралы хабарлап отырмын. Біз Сізге көмек керек екенін білеміз және ұсыныстың Сізге тиімді болғанын қалаймыз. Таңдау әрқашан өзіңізде. Ескеретін жайт: жеңілдік бағдарламасы құнның негізгі бөлігін жабады, ал Сіз сапалы құрал үшін аз ғана соманы қосасыз.\n\nТапсырысты рәсімдейміз бе?",
    "scam_plain": "Қазір біз Сізден ақша алмаймыз, тек шартты бекітеміз. Төлем — тауарды алған кезде.",
    "scam_office": "Қазір қарап шығайын, жеке кездесудің расында қажеті бар ма. Негізі, келуге болады, бірақ Сіз айтып отырған белгілерге қарағанда жағдайыңыз аса шұғыл емес. Сізде әзірге мынадай ауыр асқынулар жоқ қой?\n\nҰсынысқа қарай лайық сұрақты таңдаймыз, сонда клиент нақты «жоқ, ондай жоқ» деп жауап беруі керек.\n\nМысалы:\n— Арықтау бағыты болса — диабеттік табан әлі пайда болған жоқ па?\n— Жүрек пен тамыр болса — трофикалық жара жоқ па?\n— Асқазан-ішек немесе паразит бағыты болса — нәжісте қан жоқ па?\n— Ерлер денсаулығы, простатит, цистит болса — зәрде қан жоқ па?\n— Буын болса — аяқ-қолдың ұюы мен бұлшықет атрофиясы жоқ па?\n— Көру болса — катаракта, глаукома, тор қабық атрофиясы жоқ па?\nжәне т.б.\n\nДәл ондай жоқ па? (жауап күтеміз, нақтылаймыз)\n\nЖақсы, онда менің ойымша, әзірге жеке консультацияның аса қажеті жоқ, {Имя клиента}.\n\nЕгер бәрібір жеке келгіңіз келсе, жарты жылдан кейінгі күнге жазып қоя аламын — келу оңай емес екенін түсінесіз ғой. Сұрақ: сонша күткіңіз келе ме және 5 есе қымбат төлеуге дайынсыз ба?\n\nНегізі шешім өзіңізде. Бірақ қазіргі кезеңде жеке кездесусіз-ақ жұмыс істеуге болады, өйткені мен Сізге қашықтан оңтайлы доза мен қалпына келу сызбасын таңдап қойдым. Тәжірибем жеткілікті, сондықтан әзірге келмей-ақ, уақытыңыз бен ақшаңызды үнемдей аласыз.",
    "safety_trials": "Клиникалық сынақтар өнім әзірлену кезеңінде жүргізіледі. Құрал сатылымға шықпас бұрын біз клиникалық зерттеулер өткіземіз және сапа мен қауіпсіздік стандарттарының бәріне сәйкес болуын қамтамасыз етеміз. Әр қаптамада QR-код басылған, телефон камерасын апарсаңыз, осы тауарға берілген сәйкестік декларациясын аша аласыз. Алаңдамаңыз, нәтиже Сізді жағымды таңғалдырады.\n\nТапсырысты рәсімдейміз бе?",
    "safety_allergy": "Онда Сізге біз тіпті көбірек лайықпыз! Өйткені біздің өнім гипоаллергенді, яғни аллергия шақырмайтын құраммен жасалған. Компаниямыз аллергияға бейім клиенттерді де ойлайды.\n\nАллергиялық реакция көбіне табиғи өнімнің тазартылмаған түріне немесе дәріханалық құралдарға болады: бірінші жағдайда құрамында аллерген сақталады, екінші жағдайда фармакологиялық өңдеуден өткен қоспалар әсер етуі мүмкін. Ал біздің құралдың формуласы компоненттерді аллергеннен барынша тазартып жасалған, сонымен бірге ішінде зиянды фармқұрам жоқ. Яғни, аллергиясы бар адам үшін өнім барынша қауіпсіз. Ерекше жағдай — жекелеген тазартылған компонентке жедел жеке көтере алмаушылық, бірақ ол 100 адамның шамамен 2-сінде ғана кездеседі.\n\nТапсырысты рәсімдейміз бе?",
    "safety_return": "Егер рәсімдегеннен кейін сұрақтар туындаса, қолдау қызметіне хабарласып, әрі қарай не істеу керегін нақтылап алуға болады.",
    "safety_bad_or_medicine": "БАД пен біздің өнімнің айырмашылығын дұрыс түсіну маңызды.\n\nБіздің концентрат — БАД та емес, дәрі де емес, «сиқырлы таблетка» да емес. Бұл өсімдік сығындылары негізіндегі табиғи тағамдық концентрат, ол ағзадағы қалпына келу үдерістерін іштен іске қосуға бағытталған.\n\nНегізгі айырмашылық — өндіріс тәсілінде. Көп БАД жоғары температурамен немесе синтетикалық қоспалармен жасалады. Ал біздің концентрат суық гидролиз әдісімен өндіріледі — бұл қыздырмайтын, химия қолданылмайтын жұмсақ технология, соның арқасында пайдалы заттар барынша сақталады.\n\nСонымен қатар бізде:\n— 100% табиғи құрам\n— Қауіпсіздігі расталған өнім\n— Қайталанып ішуге ыңғайлы формат\n— Ағзаға жұмсақ әсер\n\nЯғни бұл классикалық дәріханалық сызбадан бөлек, өзіндік артықшылығы бар өнім форматы.",
    "silent_order_later": "Егер кейінге қалдырсаңыз, қазіргі шарт өзгеріп кетуі мүмкін. Сондықтан дәл қазір бекітіп алған дұрыс.",
    "silent_call_me": "Әрине, Сіз бізге қайта қоңырау шала аласыз. Бірақ бір нәрсеге назар аударыңыз: дәл қазір талқылап отырған жеңілдік шарты кейін болмауы мүмкін. Сондықтан шешімді қазір қабылдаған тиімді. Қазір рәсімдеңіз, сонда нәтижеге риза болып, бізді жақындарыңызға ұсынатындарыңызға сенімдімін.",

  function isShortKazakhVersion(obj){

    const ru = typeof obj.ru === 'string' ? obj.ru.trim() : '';

  function ui(key, ...args){
    const pack = UI[state.lang] || UI.ru;
    const val = (pack && pack[key] !== undefined) ? pack[key] : UI.ru[key];
    return typeof val === 'function' ? val(...args) : val;
  }

  function sectionTitle(s){
    return state.lang === 'kz' ? (s.title_kz || s.title_ru) : (s.title_ru || s.title_kz);
  }

  function localizedText(v, labelKey = ''){
    if (typeof v === 'string') return state.lang === 'kz' ? postProcessKzVisibleText(v) : v;
    if (v && typeof v === 'object'){
      const primary = typeof v[state.lang] === 'string' ? v[state.lang].trim() : v[state.lang];
      const ru = typeof v.ru === 'string' ? v.ru.trim() : v.ru;
      const kz = typeof v.kz === 'string' ? v.kz.trim() : v.kz;
      if (state.lang === 'kz'){
        const override = FULL_KZ_PRODUCT_OVERRIDES[labelKey];
        if (override) return postProcessKzVisibleText(override);
        const chosen = (primary || kz || ru || '');
        return postProcessKzVisibleText(chosen);
      }
      return primary || ru || kz || '';
    }
    return '';
  }

  function localizedLabel(v){
    return state.lang === 'kz' ? (v.label_kz || v.label) : (v.label || v.label_kz);
  }


  function localizeMetaString(str, lang = state.lang){
    if (!str) return '';
    if (lang !== 'kz') return str;
    return postProcessKzVisibleText(String(str)
      .replaceAll('Цена:', 'Баға:')
      .replaceAll('Льгота:', 'Жеңілдік:')
      .replaceAll('Итог:', 'Қорытынды:')

      .replaceAll('Почта: по всему Казахстану', 'Пошта: бүкіл Қазақстан бойынша'));
  }

  function tokens(){
    const isKz = state.lang === 'kz';
    const moneyWord = isKz ? 'теңге' : 'тенге';
    return {
      client: document.getElementById('clientName').value.trim() || (isKz ? 'Клиент' : 'Имя клиента'),
      op: document.getElementById('opName').value.trim() || (isKz ? 'Оператор' : 'Имя оператора'),
      priceBase: `${fmt(PRICING.base)} ${moneyWord}`,
      benefit: `${fmt(PRICING.benefit)} ${moneyWord}`,
      extraDiscount: `${fmt(PRICING.extraDiscount)} ${moneyWord}`,
      priceFinal: `${fmt(PRICING.final)} ${moneyWord}`
    };
  }

  function escapeHtml(str){
    return (str ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'", '&#039;');
  }

  function applyTokensToReplicaHtml(text){
    const t = tokens();
    let s = (text || '')
      .replaceAll('{Имя клиента}', '[[CLIENT]]')
      .replaceAll('{Имя оператора}', '[[OP]]')
      .replaceAll('{Цена}', '[[PRICE_BASE]]')
      .replaceAll('{Льгота}', '[[BENEFIT]]')
      .replaceAll('{ДопСкидка}', '[[EXTRA_DISCOUNT]]')
      .replaceAll('{Итог}', '[[PRICE_FINAL]]')
      .replaceAll('[[RED_BOLD_START]]', '[[RED_BOLD_START_TOKEN]]')
      .replaceAll('[[RED_BOLD_END]]', '[[RED_BOLD_END_TOKEN]]')
      .replaceAll('[[BOLD_START]]', '[[BOLD_START_TOKEN]]')
      .replaceAll('[[BOLD_END]]', '[[BOLD_END_TOKEN]]');

    s = escapeHtml(s)
      .replaceAll('[[CLIENT]]', `<span class="tokenClient">${escapeHtml(t.client)}</span>`)
      .replaceAll('[[OP]]', escapeHtml(t.op))
      .replaceAll('[[PRICE_BASE]]', escapeHtml(t.priceBase))
      .replaceAll('[[BENEFIT]]', escapeHtml(t.benefit))
      .replaceAll('[[EXTRA_DISCOUNT]]', escapeHtml(t.extraDiscount))
      .replaceAll('[[PRICE_FINAL]]', escapeHtml(t.priceFinal))
      .replaceAll('[[RED_BOLD_START_TOKEN]]', `<span class="replicaRedBold">`)
      .replaceAll('[[RED_BOLD_END_TOKEN]]', `</span>`)
      .replaceAll('[[BOLD_START_TOKEN]]', `<span class="replicaBold">`)
      .replaceAll('[[BOLD_END_TOKEN]]', `</span>`);

    return s.replaceAll('\n','<br>');
  }

  "Шымкент","Кайтпас 2","Карабастау","Сайрам","Таскен","Кызылсу","Бозарык","Бадам","Кайнарбулак","Кокбулак","Маятас","Аксукент","Жанаталап","Акжар","Актас молтек","Актас мольтек","Шубарсу","Ленгер",

  const DELIVERY_REGION_BY_PREFIX = {
    "01": "г. Астана",
    "02": "Акмолинская область",
    "03": "Актюбинская область",
    "04": "Алматинская область",
    "05": "г. Алматы",
    "06": "Атырауская область",
    "07": "Восточно-Казахстанская область",
    "08": "Жамбылская область",
    "09": "Западно-Казахстанская область",
    "10": "Карагандинская область",
    "11": "Костанайская область",
    "12": "Кызылординская область",
    "13": "Мангистауская область",
    "14": "Павлодарская область",
    "15": "Северо-Казахстанская область",
    "16": "Туркестанская область / г. Шымкент"
  };

  const deliveryNorm = (s) => (s || '')
    .toString()
    .trim()
    .replace(/[ёЁ]/g, (m) => m === 'ё' ? 'е' : 'Е')
    .replace(/[әӘ]/g, (m) => m === 'ә' ? 'а' : 'А')
    .replace(/[ғҒ]/g, (m) => m === 'ғ' ? 'г' : 'Г')
    .replace(/[қҚ]/g, (m) => m === 'қ' ? 'к' : 'К')
    .replace(/[ңҢ]/g, (m) => m === 'ң' ? 'н' : 'Н')
    .replace(/[өӨ]/g, (m) => m === 'ө' ? 'о' : 'О')
    .replace(/[ұҰүҮ]/g, (m) => /[ұү]/.test(m) ? 'у' : 'У')
    .replace(/[іІ]/g, (m) => m === 'і' ? 'и' : 'И')
    .replace(/[һҺ]/g, (m) => m === 'һ' ? 'х' : 'Х')
    .replace(/[—–−]/g, '-')
    .replace(/\s+/g, ' ')
    .toLowerCase();

  DELIVERY_POSTAL_DATA['Риддер'] = DELIVERY_POSTAL_DATA['Риддер'] || ['071300','071301','071302','071303'];
  const deliveryPostalIndex = new Map(Object.entries(DELIVERY_POSTAL_DATA).map(([k, v]) => [deliveryNorm(k), { city:k, codes:v }]));
  const DELIVERY_MAJOR_CITIES = [
    'Актау','Актобе','Алматы','Астана','Атырау','Балхаш','Жанаозен','Жезказган','Караганда','Кульсары','Кокшетау',
    'Костанай','Кызылорда','Павлодар','Петропавловск','Рудный','Семей','Сарыагаш','Талдыкорган',
    'Тараз','Туркестан','Уральск','Усть-Каменогорск','Шымкент','Экибастуз'
  ];
  const deliveryCourierSet = new Set(DELIVERY_COURIER_CITIES.map(c => deliveryNorm(c)));
  const deliveryMajorCourierSet = new Set(DELIVERY_MAJOR_CITIES.map(c => deliveryNorm(c)));
  const deliveryAllNames = Array.from(new Set([...Object.keys(DELIVERY_POSTAL_DATA), ...DELIVERY_COURIER_CITIES]))
    .sort((a, b) => a.localeCompare(b, 'ru'));

  function deliveryRegionFromCode(code) {
    const s = String(code || '').trim();
    if (s.length < 2) return '';
    return DELIVERY_REGION_BY_PREFIX[s.slice(0, 2)] || '';
  }

  function deliveryResolveName(query) {
    const q = deliveryNorm(query);
    if (!q) return null;
    if (deliveryPostalIndex.has(q)) return deliveryPostalIndex.get(q).city;
    if (deliveryCourierSet.has(q)) return DELIVERY_COURIER_CITIES.find(c => deliveryNorm(c) === q) || null;
    const starts = deliveryAllNames.find(n => deliveryNorm(n).startsWith(q));
    if (starts) return starts;
    return deliveryAllNames.find(n => deliveryNorm(n).includes(q)) || null;
  }

  function deliveryHighlight(text, query) {
    const source = String(text || '');
    const q = deliveryNorm(query);
    if (!q) return escapeHtml(source);
    const idx = deliveryNorm(source).indexOf(q);
    if (idx === -1) return escapeHtml(source);
    return `${escapeHtml(source.slice(0, idx))}<span class="deliveryCheckMark">${escapeHtml(source.slice(idx, idx + q.length))}</span>${escapeHtml(source.slice(idx + q.length))}`;
  }



  function getDeliveryCheckerI18n() {
    return state.lang === 'kz'
      ? {
          placeholder:'Қаланы немесе елді мекенді енгізіңіз…',
          button:'Тексеру',
          notFound:'Табылмады',
          courier:'Курьер',
          post:'Пошта',
          acCourier:'курьер',
          acPost:'пошта',
          acBoth:'курьер + пошта'
        }
      : {
          placeholder:'Введите город или населённый пункт…',
          button:'Проверить',
          notFound:'Не найдено',
          courier:'Курьер',
          post:'Почта',
          acCourier:'курьер',
          acPost:'почта',
          acBoth:'курьер + почта'
        };
  }

  function getDeliveryCheckerHtml() {
    const t = getDeliveryCheckerI18n();
    return `<div class="deliveryCheck" data-delivery-checker><div class="deliveryCheckRow"><div class="deliveryCheckInputWrap"><input type="text" class="deliveryCheckInput" data-delivery-input placeholder="${escapeHtml(t.placeholder)}" autocomplete="off" autocapitalize="none" spellcheck="false"><div class="deliveryCheckAc" data-delivery-ac></div></div><button type="button" class="deliveryCheckBtn" data-delivery-btn>${escapeHtml(t.button)}</button></div><div class="deliveryCheckResult" data-delivery-result></div></div>`;
  }

  function mountDeliveryChecker(root) {
    const scope = root && root.querySelector ? root.querySelector('[data-delivery-checker]') : null;
    if (!scope || scope.dataset.bound === '1') return;
    scope.dataset.bound = '1';

    const inputEl = scope.querySelector('[data-delivery-input]');
    const btnEl = scope.querySelector('[data-delivery-btn]');
    const resultEl = scope.querySelector('[data-delivery-result]');
    const acEl = scope.querySelector('[data-delivery-ac]');
    const t = getDeliveryCheckerI18n();
    let activeIndex = -1;

    function renderResult(place, silent = false) {
      resultEl.innerHTML = '';
      if (!place) {
        if (!silent) resultEl.innerHTML = `<span class="deliveryCheckPill warn">${escapeHtml(t.notFound)}</span>`;
        return;
      }

      const normalized = deliveryNorm(place);
      const post = deliveryPostalIndex.get(normalized);
      const isCourier = deliveryCourierSet.has(normalized);
      const isMajorCourierCity = deliveryMajorCourierSet.has(normalized);

      if (!post && !isCourier) {
        resultEl.innerHTML = `<span class="deliveryCheckPill warn">${escapeHtml(t.notFound)}</span>`;
        return;
      }

      const pills = [];
      if (isCourier || isMajorCourierCity) {
        pills.push(`<span class="deliveryCheckPill ok">${escapeHtml(t.courier)}</span>`);
      }
      if (post && !isMajorCourierCity) {
        pills.push(`<span class="deliveryCheckPill post">${escapeHtml(t.post)}</span>`);
        (post.codes || []).forEach(code => pills.push(`<span class="deliveryCheckPill post">${escapeHtml(String(code))}</span>`));
      }
      resultEl.innerHTML = pills.join('');
    }

    function buildSuggestions(query) {
      const q = deliveryNorm(query);
      if (!q) return [];
      const starts = deliveryAllNames.filter(name => deliveryNorm(name).startsWith(q)).slice(0, 12);
      const contains = deliveryAllNames.filter(name => !deliveryNorm(name).startsWith(q) && deliveryNorm(name).includes(q)).slice(0, 12);
      return [...starts, ...contains].slice(0, 12);
    }

    function showSuggestions(items) {
      acEl.innerHTML = '';
      activeIndex = -1;
      if (!items.length) {
        acEl.style.display = 'none';
        return;
      }

      items.forEach((name) => {
        const normalized = deliveryNorm(name);
        const hasPost = deliveryPostalIndex.has(normalized);
        const hasCourier = deliveryCourierSet.has(normalized);
        const isMajorCourierCity = deliveryMajorCourierSet.has(normalized);
        const meta = (hasCourier && hasPost && !isMajorCourierCity) ? t.acBoth : (hasCourier ? t.acCourier : (hasPost ? t.acPost : ''));

        const itemEl = document.createElement('div');
        itemEl.className = 'deliveryCheckAcItem';
        itemEl.innerHTML = `<span>${deliveryHighlight(name, inputEl.value)}</span>${meta ? `<span class="deliveryCheckAcMeta">${escapeHtml(meta)}</span>` : ''}`;
        itemEl.addEventListener('mousedown', (event) => {
          event.preventDefault();
          inputEl.value = name;
          acEl.style.display = 'none';
          renderResult(name);
        });
        acEl.appendChild(itemEl);
      });
      acEl.style.display = 'block';
    }

    function checkCurrentValue() {
      const resolved = deliveryResolveName(inputEl.value);
      renderResult(resolved || inputEl.value.trim());
    }

    inputEl.addEventListener('input', () => showSuggestions(buildSuggestions(inputEl.value)));
    inputEl.addEventListener('focus', () => showSuggestions(buildSuggestions(inputEl.value)));
    inputEl.addEventListener('blur', () => setTimeout(() => { acEl.style.display = 'none'; }, 120));
    inputEl.addEventListener('keydown', (event) => {
      const visible = acEl.style.display === 'block';
      const items = Array.from(acEl.children);
      if (visible && event.key === 'ArrowDown') {
        event.preventDefault();
        activeIndex = Math.min(items.length - 1, activeIndex + 1);
        items.forEach((item, index) => item.classList.toggle('active', index === activeIndex));
        return;
      }
      if (visible && event.key === 'ArrowUp') {
        event.preventDefault();
        activeIndex = Math.max(0, activeIndex - 1);
        items.forEach((item, index) => item.classList.toggle('active', index === activeIndex));
        return;
      }
      if (event.key === 'Enter') {
        event.preventDefault();
        if (visible && activeIndex >= 0 && items[activeIndex]) {
          items[activeIndex].dispatchEvent(new Event('mousedown'));
          return;
        }
        checkCurrentValue();
      }
    });
    btnEl.addEventListener('click', checkCurrentValue);

    renderResult('', true);
  }

  function buildReplicaIntroHtml(section, selectedLabel, selectedPrepayKey){
    const parts = [];
    if (section && (section.id === 'price' || section.id === 'checkout')) {
      const priceOfferHtml = applyTokensToReplicaHtml(state.lang === 'kz' ? TEXT.kz.price_offer : TEXT.ru.price_offer);
      parts.push(`<div class="textBlock">${priceOfferHtml}</div>`);
    }

    if (section && section.id === 'price') {
      parts.push(`<div class="textBlock addressPromptBlock">${applyTokensToReplicaHtml(state.lang === 'kz' ? TEXT.kz.price_address : TEXT.ru.price_address)}</div>`);
      parts.push(getDeliveryCheckerHtml());
    }

    if (section && section.id === 'checkout') {
      parts.push(`<div class="textBlock">${applyTokensToReplicaHtml(getPrepaymentIntroText())}</div>`);
      const objectionButtons = getPrepaymentButtons().filter(btn => matchesSearch(`${localizedLabel(btn)} ${localizedText(btn.text, btn.label)}`));
      if (objectionButtons.length) {
        const buttonsHtml = objectionButtons.map(btn => `<button type="button" class="chip red${selectedPrepayKey === btn.key ? ' active' : ''} replicaPrepayBtn" data-prepay-key="${escapeHtml(btn.key)}">${escapeHtml(localizedLabel(btn))}</button>`).join('');
        parts.push(`<div class="replicaDeliveryLead">${escapeHtml(state.lang === 'kz' ? 'Алдын ала төлем бойынша қарсылықтар:' : 'Возражения по предоплате:')}</div>`);
        parts.push(`<div class="btnGrid replicaPrepayButtons">${buttonsHtml}</div>`);
      }
      if (selectedPrepayKey && PREPAYMENT_OBJECTIONS[selectedPrepayKey]) {
        parts.push(`<div class="replicaDeliveryContent">${applyTokensToReplicaHtml(localizedText(PREPAYMENT_OBJECTIONS[selectedPrepayKey].text, PREPAYMENT_OBJECTIONS[selectedPrepayKey].label))}</div>`);
      }
    }

    return parts.join('');
  }

  function renderDeliveryReplica(section, selectedLabel='', selectedPrepayKey=''){
    if (!section) return;
    const list = getDeliveryButtons(section).filter(btn => matchesSearch(`${localizedLabel(btn)} ${localizedText(btn.text, btn.label)}`));
    const selectedBtn = getDeliveryButtons(section).find(item => item.label === selectedLabel) || null;
    const lead = state.lang === 'kz' ? 'Жеткізу түрін таңдаңыз:' : 'Мы можем вам доставить?';
    const emptyText = state.lang === 'kz' ? 'Бұл іздеу бойынша жеткізу нұсқалары табылмады.' : 'По текущему поиску варианты доставки не найдены.';
    const placeholder = state.lang === 'kz' ? 'Төмендегі батырмалардың бірін таңдаңыз.' : 'Выберите один из вариантов ниже.';
    const currentPrepayKey = selectedPrepayKey || getPrepaySelectedKey(section) || '';
    if (state.prepayObjectionKeyBySection) state.prepayObjectionKeyBySection[section.id] = currentPrepayKey;
    setReplicaImage('');
    state.activeKey = selectedBtn ? `${section.id}||deliveryOption||${selectedBtn.label}` : `${section.id}||deliveryChooser`;
    replicaMetaEl.textContent = `${sectionTitle(section)} → ${state.lang === 'kz' ? 'Жеткізу нұсқалары' : 'Варианты доставки'}`;

    if (!list.length) {
      replicaTextEl.innerHTML = `${buildReplicaIntroHtml(section, selectedLabel, currentPrepayKey)}<div class="replicaDeliveryLead">${escapeHtml(lead)}</div><div class="replicaDeliveryPlaceholder">${escapeHtml(emptyText)}</div>`;
      syncReplicaActions(section);
      mountDeliveryChecker(replicaTextEl);
      return;
    }

    const buttonsHtml = list.map(btn => `<button type="button" class="chip ${escapeHtml(btn.color || 'purple')}${selectedBtn && selectedBtn.label === btn.label ? ' active' : ''} replicaDeliveryBtn" data-delivery-label="${escapeHtml(btn.label)}">${escapeHtml(localizedLabel(btn))}</button>`).join('');
    const contentHtml = selectedBtn
      ? applyTokensToReplicaHtml(localizedText(selectedBtn.text, selectedBtn.label))
      : `<div class="replicaDeliveryPlaceholder">${escapeHtml(placeholder)}</div>`;

    replicaTextEl.innerHTML = `${buildReplicaIntroHtml(section, selectedLabel, currentPrepayKey)}<div class="replicaDeliveryLead">${escapeHtml(lead)}</div><div class="btnGrid replicaDeliveryButtons">${buttonsHtml}</div><div class="replicaDeliveryContent">${contentHtml}</div>`;
    syncReplicaActions(section);
    replicaTextEl.querySelectorAll('.replicaDeliveryBtn').forEach(el => {
      el.onclick = () => openDeliveryOption(section, el.getAttribute('data-delivery-label') || '');
    });
    replicaTextEl.querySelectorAll('.replicaPrepayBtn').forEach(el => {
      el.onclick = () => openPrepayObjection(section, selectedBtn ? selectedBtn.label : '', el.getAttribute('data-prepay-key') || '');
    });
    mountDeliveryChecker(replicaTextEl);
  }

  function formatProductPresentationHtml(text){
    const lines = String(text || '').split(/\r?\n/);
    const parts = [];
    const headerRe = /^(ПРЕЗЕНТАЦИЯ|ТОВАР|НАПРАВЛЕНИЕ|БАҒЫТЫ|1 УПАКОВКА|1 ҚАПТАМА|ПРИЁМ|ҚАБЫЛДАУ|АКЦИЯ\/УСЛОВИЯ|АКЦИЯ\/ШАРТ|ДОСТАВКА|ЖЕТКІЗУ|Заметка|Ескерту|Артықшылықтары)\s*:/i;
    const commentRe = /^(Комментарий оператора(?:[^:]*)?|Оператордың түсіндірмесі(?:[^:]*)?|Комментарий(?:[^:]*)?)\s*:/i;
    const questionRe = /[?？]\s*(\([^)]*\))?\s*$/;

    lines.forEach(line => {
      const raw = (line || '').trim();
      if (!raw) return;

      if (commentRe.test(raw)) {
        const idx = raw.indexOf(':');
        const label = idx >= 0 ? raw.slice(0, idx + 1) : raw;
        const body = idx >= 0 ? raw.slice(idx + 1).trim() : '';
        parts.push(`<div class="productReplicaComment"><span class="productReplicaCommentLabel">${applyTokensToReplicaHtml(label)}</span>${body ? `<div class="productReplicaCommentBody">${applyTokensToReplicaHtml(body)}</div>` : ''}</div>`);
        return;
      }

      if (questionRe.test(raw)) {
        parts.push(`<div class="productReplicaQuestion">${applyTokensToReplicaHtml(raw)}</div>`);
        return;
      }

      if (headerRe.test(raw)) {
        const isPresentationHeader = /^ПРЕЗЕНТАЦИЯ\s*:/i.test(raw);
        parts.push(`<div class="${isPresentationHeader ? 'productReplicaHeader' : 'productReplicaMeta'}">${applyTokensToReplicaHtml(raw)}</div>`);
        return;
      }

      parts.push(`<div class="productReplicaParagraph">${applyTokensToReplicaHtml(raw)}</div>`);
    });

    return `<div class="productReplicaFormatted">${parts.join('')}</div>`;
  }

  function setReplica(sectionTitleText, btnLabelText, text){
    setReplicaImage('');
    replicaMetaEl.textContent = `${sectionTitleText} → ${btnLabelText}`;
    const isProductReplica = (currentSection() && currentSection().id === 'products') || (state.activeKey && state.activeKey.startsWith('product||'));

      ? formatProductPresentationHtml(text)
      : applyTokensToReplicaHtml(text);
    syncReplicaActions();
  }

        : 'почта / курьер: Актау, Алматы, Кокшетау, Туркестан, Шымкент, Астана';

  function renderMenu(){
    menuEl.innerHTML = '';
    SECTIONS.forEach(s => {
      const a = document.createElement('a');
      a.href = '#';
      a.textContent = sectionTitle(s);
      if (s.id === state.sectionId) a.classList.add('active');
      a.onclick = (e) => { e.preventDefault(); goToSection(s.id); };

        PRODUCTS.forEach(group => {
          const cat = document.createElement('div');
          cat.className = 'cat';

          menuEl.appendChild(cat);

            const deliveryNote = getSidebarDeliveryNote(item, group);
            sub.href = '#';
            sub.className = 'sub';
            sub.innerHTML = `${escapeHtml(plainLabel)}${deliveryNote ? ` <span class="menuDeliveryNote">(${escapeHtml(deliveryNote)})</span>` : ''}`;

              state.sectionId = 'products';
              state.productCategory = group.cat;
              state.activeKey = `product||${item.label}`;
              render();
              setReplica(sectionTitle(currentSection()), plainLabel, localizedText(item.text, item.label));
            };
            menuEl.appendChild(sub);
          });
        });
      }
    });

  function getProductGroupByKey(key){
    if (!PRODUCTS.length) return null;
    return PRODUCTS.find(group => group.cat === key) || PRODUCTS[0] || null;
  }

  function getProductGroupByItemLabel(label){
    return PRODUCTS.find(group => group.items.some(item => item.label === label)) || null;
  }

  function getVisibleProductItems(group){
    if (!group || !Array.isArray(group.items)) return [];
    return group.items.filter(item => matchesSearch(`${item.label} ${item.label_kz || ''} ${localizedText(item.text, item.label)}`));
  }

  function ensureProductCategory(){
    const currentGroup = getProductGroupByKey(state.productCategory);
    if (currentGroup) {
      state.productCategory = currentGroup.cat;
      return currentGroup;
    }
    const firstGroup = PRODUCTS.find(group => Array.isArray(group.items) && group.items.length) || null;
    state.productCategory = firstGroup ? firstGroup.cat : null;
    return firstGroup;
  }

  function renderProductsSwitchboard(){
    const mount = sectionContentEl.querySelector('#productsMount');
    if (!mount) return;

    const isKz = state.lang === 'kz';
    const emptyText = isKz ? 'Ағымдағы іздеуде ештеңе табылмады.' : 'По текущему поиску здесь ничего не найдено.';
    const chooseText = isKz ? 'Өнімді таңдаңыз' : 'Выберите продукт';

    ensureProductCategory();

    mount.innerHTML = `
      <div class="objSwitchboard">
        <div class="objWorkspace">
          <div class="objTabs" id="productTabs"></div>
          <div class="objPanels" id="productPanels"></div>
        </div>
      </div>`;

    const tabsEl = mount.querySelector('#productTabs');
    const panelsEl = mount.querySelector('#productPanels');

    PRODUCTS.forEach(group => {
      const tab = document.createElement('button');
      tab.className = `objTab ${group.cat === state.productCategory ? 'active' : ''}`;
      tab.textContent = isKz ? (group.cat_kz || group.cat) : group.cat;
      tab.onclick = () => {
        state.productCategory = group.cat;
        state.activeKey = null;
        renderSection();
      };
      tabsEl.appendChild(tab);

      const panel = document.createElement('div');
      panel.className = 'objPanel';
      panel.style.display = group.cat === state.productCategory ? '' : 'none';

      const title = document.createElement('div');
      title.className = 'objPanelTitle';
      title.textContent = `${chooseText}: ${isKz ? (group.cat_kz || group.cat) : group.cat}`;
      panel.appendChild(title);

      const grid = document.createElement('div');
      grid.className = 'btnGrid';
      const visibleItems = getVisibleProductItems(group);

      visibleItems.forEach((item, idx) => {
        const display = `${idx + 1}. ${isKz ? (item.label_kz || item.label) : item.label}`;
        const deliveryNote = getSidebarDeliveryNote(item, group);
        const btn = document.createElement('button');
        btn.className = `chip ${item.color || 'gray'} ${state.activeKey === `product||${item.label}` ? 'active' : ''} ${display.length > 50 ? 'long' : ''}`;
        btn.innerHTML = `<span class="productBtnLabel">${escapeHtml(display)}</span>${deliveryNote ? `<span class="productBtnNote">${escapeHtml(deliveryNote)}</span>` : ''}`;
        btn.onclick = () => {
          state.productCategory = group.cat;
          state.activeKey = `product||${item.label}`;
          renderSection();
          scrollReplicaIntoView();
        };
        grid.appendChild(btn);
      });

      panel.appendChild(grid);

      const empty = document.createElement('div');
      empty.className = 'objEmpty';
      empty.textContent = emptyText;
      empty.style.display = visibleItems.length ? 'none' : 'block';
      panel.appendChild(empty);

      panelsEl.appendChild(panel);
    });
  }


  function buildPricePromoTableHtml(lang='ru'){
    const isKz = lang === 'kz';
    const titleProduct = isKz ? 'Өнім атауы' : 'Название продукта';
    const titlePromo = isKz ? 'Науқан' : 'Акция';
    const titlePrice = isKz ? 'Баға' : 'Цена';
    const titleCondition = isKz ? 'Шарт' : 'Условие';
    const promoTableTitle = isKz ? 'Жаңа тауарлар (акциялар)' : 'Новые товары (акции)';
    const standardTableTitle = isKz ? 'Стандартты тауарлар' : 'Стандартные товары';
    const promoRows = PRODUCTS
      .flatMap(group => group.items.filter(item => item.isPromo))
      .map(item => `<tr><td>${escapeHtml(isKz ? (item.label_kz || item.label) : item.label)}</td><td>${escapeHtml(localizeMetaString(item.tablePromo || '', lang))}</td><td>${escapeHtml(localizeMetaString(item.tablePrice || '', lang))}</td></tr>`)
      .join('');
    const standardRows = PRODUCTS
      .flatMap(group => group.items.filter(item => !item.isPromo && group.cat !== 'ПОДАРОК НА ПОЧТУ'))
      .map(item => `<tr><td>${escapeHtml(isKz ? (item.label_kz || item.label) : item.label)}</td><td>${escapeHtml(localizeMetaString(item.tableCondition || (isKz ? 'Стандартты жеңілдік' : 'Стандартная льгота'), lang))}</td><td>${escapeHtml(localizeMetaString(item.tablePrice || '', lang))}</td></tr>`)
      .join('');
    const promoAttention = isKz
      ? `Жаңа тауарлар үшін акция 2+1 бойынша жүреді. Курьер тек мына қалаларға жеткізеді — <span class="cityListRed">Актау, Алматы, Кокшетау, Туркестан, Шымкент, Астана</span>. Пошта — Қазақстан бойынша.`
      : `Для новых товаров товары по акции идут 2+1. Обязательно проверяйте доставку: курьерская доставка доступна только по городам — <span class="cityListRed">Актау, Алматы, Кокшетау, Туркестан, Шымкент, Астана</span>. Почтовая доставка доступна по всему Казахстану.`;
    const standardAttention = isKz
      ? `Стандартты тауарлар үшін базалық схема қолданылады: баға 90 000 ₸, жеңілдік 50 000 ₸, жеке жеңілдік 3 000 ₸, қорытынды 37 000 ₸.`
      : `Для стандартных товаров действует базовая схема: цена 90 000 ₸, льгота 50 000 ₸, персональная скидка 3 000 ₸, итог 37 000 ₸.`;
    return `
      <div class="priceTableWrap">
        <div class="priceTableTitle">${promoTableTitle}</div>
        <table class="priceTable">
          <thead><tr><th>${titleProduct}</th><th>${titlePromo}</th><th>${titlePrice}</th></tr></thead>
          <tbody>${promoRows}</tbody>
        </table>
        <div class="priceAttention">${promoAttention}</div>
      </div>
      <div class="priceTableWrap">
        <div class="priceTableTitle">${standardTableTitle}</div>
        <table class="priceTable">
          <thead><tr><th>${titleProduct}</th><th>${titleCondition}</th><th>${titlePrice}</th></tr></thead>
          <tbody>${standardRows}</tbody>
        </table>
        <div class="priceAttention">${standardAttention}</div>
      </div>`;
  }

  function restoreActiveReplica(section){
    if (!state.activeKey || !section) return false;

    if (state.activeKey === `${section.id}||deliveryChooser`) {
      openDeliveryChooser(section);
      return true;
    }

    if (state.activeKey.startsWith(`${section.id}||deliveryOption||`)) {
      openDeliveryOption(section, state.activeKey.split('||')[2] || '');
      return true;
    }

    if (state.activeKey.startsWith('product||')) {
      const productKey = state.activeKey.split('||')[1];
      const item = PRODUCTS.flatMap(group => group.items).find(p => p.label === productKey);
      if (!item) return false;
      const group = getProductGroupByItemLabel(productKey);
      if (group) state.productCategory = group.cat;
      setReplica(sectionTitle(section), state.lang === 'kz' ? (item.label_kz || item.label) : item.label, localizedText(item.text, item.label));
      return true;
    }

    const parts = state.activeKey.split('||');
    const targetGrid = parts[1] === 'auto' ? null : parts[1];
    const targetLabel = parts[2] || parts[1] || '';
    const grids = section.buttonsByGrid || {};

    for (const [gridName, buttons] of Object.entries(grids)) {
      if (targetGrid && gridName !== targetGrid) continue;
      const idx = buttons.findIndex(btn => btn.label === targetLabel);
      if (idx === -1) continue;
      const btn = buttons[idx];
      const display = (section.id === 'objAfterPrice' && gridName.startsWith('obj'))
        ? `${idx + 1}. ${localizedLabel(btn)}`
        : localizedLabel(btn);
      setReplica(sectionTitle(section), display, localizedText(btn.text));
      return true;
    }

    return false;
  }

  function syncObjCategoryUI(section){
    if (!section || section.id !== 'objAfterPrice') return;

    const catMap = {
      cost:'objCost', doubts:'objDoubts', scam:'objScam', safety:'objSafety',
      silent:'objSilent', negative:'objNegative', assortment:'objAssortment', pensioners:'objPensioners'
    };

    sectionContentEl.querySelectorAll('[data-objcat]').forEach(tab => {
      const cat = tab.getAttribute('data-objcat');
      tab.classList.toggle('active', cat === state.objCategory);
      tab.onclick = () => {
        state.objCategory = cat;
        state.activeKey = null;
        renderSection();
      };
    });

    sectionContentEl.querySelectorAll('[data-objpanel]').forEach(panel => {
      panel.style.display = panel.getAttribute('data-objpanel') === state.objCategory ? '' : 'none';
    });

    sectionContentEl.querySelectorAll('[data-empty-for]').forEach(empty => {
      const gridName = empty.getAttribute('data-empty-for');
      const grid = sectionContentEl.querySelector(`[data-grid="${gridName}"]`);
      const visible = catMap[state.objCategory] === gridName && grid && !grid.children.length;
      empty.style.display = visible ? 'block' : 'none';
    });
  }

  function renderSection(){
    const s = currentSection();
    pageTitleEl.textContent = sectionTitle(s);
    quickAreaEl.innerHTML = '';

    if (s.id === 'objAfterPrice' || s.id === 'products') {
      pageEl.appendChild(replicaBoxEl);
    } else {
      pageEl.insertBefore(replicaBoxEl, sectionContentEl);
    }

    syncReplicaActions(s);
    sectionContentEl.innerHTML = localizedText(s.contentHtml);

    if (s.id === 'products') {
      renderProductsSwitchboard();
    }
    if (s.id === 'price') {
      const priceMount = sectionContentEl.querySelector('#priceTablesMount');
      if (priceMount) priceMount.innerHTML = buildPricePromoTableHtml(state.lang);
    }

    const grids = [...sectionContentEl.querySelectorAll('[data-grid]')];
    grids.forEach(gridEl => {
      const gridName = gridEl.getAttribute('data-grid');
      const list = (s.buttonsByGrid && s.buttonsByGrid[gridName]) ? s.buttonsByGrid[gridName] : [];
      gridEl.innerHTML = '';
      list
        .filter(btn => matchesSearch(`${localizedLabel(btn)} ${localizedText(btn.text)}`))
        .forEach((btn, idx) => {
          const display = (s.id === 'objAfterPrice' && gridName.startsWith('obj')) ? `${idx + 1}. ${localizedLabel(btn)}` : localizedLabel(btn);
          const b = document.createElement('button');
          b.className = `chip ${btn.color || 'gray'} ${display.length > 50 ? 'long' : ''}`;
          b.textContent = display;
          b.onclick = () => {
            if (btn.deliveryChooser) {
              openDeliveryChooser(s);
              return;
            }
            state.activeKey = `${s.id}||${gridName}||${btn.label}`;
            setReplica(sectionTitle(s), display, localizedText(btn.text));
            if (s.id === 'objAfterPrice') scrollReplicaIntoView();
            if (btn.goto) goToSection(btn.goto);
          };
          gridEl.appendChild(b);
        });
    });

    syncObjCategoryUI(s);

    const restoredReplica = restoreActiveReplica(s);

    if (!restoredReplica) {
      if (s.id === 'products') {
        const preferredGroup = ensureProductCategory();
        const hasVisibleInPreferred = preferredGroup && getVisibleProductItems(preferredGroup).length;
        const fallbackGroup = PRODUCTS.find(group => getVisibleProductItems(group).length) || preferredGroup;
        const targetGroup = hasVisibleInPreferred ? preferredGroup : fallbackGroup;
        const visibleItems = getVisibleProductItems(targetGroup);
        const firstItem = (visibleItems[0]) || ((targetGroup && targetGroup.items && targetGroup.items[0]) ? targetGroup.items[0] : null);
        if (targetGroup) state.productCategory = targetGroup.cat;
        if (firstItem) {
          setReplica(sectionTitle(s), state.lang === 'kz' ? (firstItem.label_kz || firstItem.label) : firstItem.label, localizedText(firstItem.text, firstItem.label));
          state.activeKey = `product||${firstItem.label}`;
          syncReplicaActions(s);
        } else {
          replicaMetaEl.textContent = `${sectionTitle(s)} → ${ui('replicaHint')}`;
          replicaTextEl.textContent = '—';
          syncReplicaActions(s);
        }
      } else if (s.id === 'price' || s.id === 'checkout') {
        openDeliveryChooser(s);
      } else {
        const allButtons = Object.values(s.buttonsByGrid || {}).flat();
        const first = allButtons.find(btn => matchesSearch(`${localizedLabel(btn)} ${localizedText(btn.text)}`));
        if (first) {
          const display = localizedLabel(first);
          setReplica(sectionTitle(s), display, localizedText(first.text));
          state.activeKey = `${s.id}||auto||${first.label}`;
        } else {
          replicaMetaEl.textContent = `${sectionTitle(s)} → ${ui('replicaHint')}`;
          replicaTextEl.textContent = '—';
        }
      }
    }
  }

  function bindPrevNext(){
    const idx = FLOW.indexOf(state.sectionId);
    btnPrevEl.disabled = idx <= 0;
    btnNextEl.disabled = idx >= FLOW.length - 1;
    btnPrevEl.onclick = () => { if (idx > 0) goToSection(FLOW[idx - 1]); };
    btnNextEl.onclick = () => { if (idx < FLOW.length - 1) goToSection(FLOW[idx + 1]); };
  }

  function render(){
    renderTopUI();
    renderStagePills();
    renderMenu();
    renderSection();
    bindPrevNext();
  }

  document.getElementById('clientName').addEventListener('input', renderSection);
  document.getElementById('opName').addEventListener('input', renderSection);
  document.getElementById('search').addEventListener('input', (e) => {
    state.search = e.target.value;
    state.activeKey = null;
    renderSection();
  });
  btnLangEl.addEventListener('click', () => {
    state.lang = state.lang === 'ru' ? 'kz' : 'ru';
    state.search = '';
    document.getElementById('search').value = '';
    render();
    btnLangEl.blur();
  });
  if (replicaBackTopBtnEl) {
    replicaBackTopBtnEl.addEventListener('click', () => {
      scrollSectionTop();
      replicaBackTopBtnEl.blur();
    });
  }

  render();
</script>
</body>
</html>
