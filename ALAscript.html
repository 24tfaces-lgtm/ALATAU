


<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Электронный скрипт Даралтай</title>
  <style>
    :root{
      --bg:#f3f5f8;
      --panel:#ffffff;
      --border:#d9dee7;
      --text:#111827;
      --muted:#6b7280;
      --blue:#0ea5e9;
      --blue2:#0284c7;
      --greenBg:#24b35a;
      --redBg:#e24a4a;
      --grayBg:#6b7280;
      --teal:#06b6d4;
      --yellow:#f59e0b;
      --purple:#8b5cf6;
      --radius:10px;
      --shadow2: 0 6px 18px rgba(0,0,0,.06);
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial;
    }
    *{box-sizing:border-box}
    body{ margin:0; font-family:var(--sans); background:var(--bg); color:var(--text); }
    .app{ display:grid; grid-template-columns:1fr 340px; gap:18px; padding:16px; min-height:100vh; }
    .main{ min-width:0; }
    .sidebar{
      position:sticky; top:16px; height:calc(100vh - 32px); background:var(--panel);
      border:1px solid var(--border); box-shadow:var(--shadow2); overflow:hidden; display:flex; flex-direction:column;
    }
    .sbTop{ padding:14px; border-bottom:1px solid var(--border); }
    .sbTitle{ font-weight:700; font-size:14px; letter-spacing:.02em; margin:0 0 10px 0; text-transform:uppercase; }
    .inputs{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .field label{ display:block; font-size:11px; color:var(--muted); font-weight:600; margin-bottom:4px; }
    .field input, .searchWrap input{
      width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px; outline:none; background:#fff; font-size:12px;
    }
    .field input:focus, .searchWrap input:focus{ border-color:rgba(14,165,233,.55); box-shadow:0 0 0 3px rgba(14,165,233,.12); }
    .searchWrap{ padding:12px 14px; border-bottom:1px solid var(--border); background:#fafbfd; }
    .menu{ overflow:auto; padding:10px; }
    .menu a{
      display:block; padding:10px 12px; margin:8px 6px; border:1px solid var(--border); background:#e9f5fb;
      color:#0f172a; font-weight:700; text-decoration:none; text-transform:uppercase; letter-spacing:.02em; font-size:12px;
    }
    .menu a.active{ background:var(--blue); border-color:var(--blue2); color:#fff; }
    .menu .cat{ margin:12px 8px 6px 8px; font-size:11px; color:var(--muted); font-weight:800; text-transform:uppercase; letter-spacing:.05em; }
    .menu a.sub{
      margin:0 6px 6px 18px; padding:8px 10px; font-size:11px; text-transform:none; letter-spacing:0;
      background:#f4fbff; border-left:4px solid rgba(14,165,233,.35); border-radius:8px; font-weight:700;
    }
    .page{ background:var(--panel); border:1px solid var(--border); box-shadow:var(--shadow2); padding:18px; }
    .pageTitle{ margin:0 0 14px 0; font-weight:800; text-transform:uppercase; letter-spacing:.04em; text-align:center; }
    .stageBar{ display:flex; flex-wrap:wrap; gap:10px; margin:0 0 14px 0; padding:12px; border:1px solid var(--border); background:#fbfdff; box-shadow:var(--shadow2); }
    .stageLeft{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-right:auto; }
    .stageRight{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    button.navBtn{
      border:none; cursor:pointer; padding:8px 10px; border-radius:8px; font-weight:700; font-size:13px;
      box-shadow:var(--shadow2); color:#fff; background:var(--grayBg); display:flex; gap:8px; align-items:center; white-space:nowrap;
    }
    button.navBtn.blue{ background:var(--blue); }
    button.navBtn.outline{ background:#fff; color:#0f172a; border:1px solid var(--border); }
    button.navBtn:disabled{ opacity:.55; cursor:default; }
    .stagePills{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    button.stagePill{
      border:1px solid var(--border); background:#fff; color:#0f172a; cursor:pointer; padding:7px 9px;
      border-radius:8px; font-weight:800; font-size:11px; text-transform:uppercase; letter-spacing:.03em;
    }
    button.stagePill.active{ background:var(--blue); color:#fff; border-color:var(--blue2); }
    #quickArea{ margin:0 0 14px 0; }
    .replicaBox{ border:2px solid rgba(14,165,233,.25); background:#f2fbff; padding:14px; box-shadow:var(--shadow2); margin:0 0 16px 0; }
    .replicaHead{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
    .replicaHead .label, .replicaHead .price{
      font-weight:900; font-size:12px; background:#fff; border:1px solid var(--border); padding:6px 10px;
    }
    .replicaHead .meta{ font-size:12px; color:var(--muted); font-weight:700; }
    .replicaText{ font-size:18px; line-height:1.55; font-weight:900; white-space:pre-wrap; word-wrap:break-word; margin:0; }
    .tokenClient{ color:#ef4444; font-weight:900; }
    .banner{ padding:10px 12px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; margin:10px 0; display:block; border-left:6px solid transparent; }
    .banner.teal{ background:rgba(6,182,212,.18); border-left-color:var(--teal); }
    .banner.red{ background:rgba(239,68,68,.12); border-left-color:var(--redBg); }
    .banner.green{ background:rgba(34,197,94,.14); border-left-color:var(--greenBg); }
    .banner.yellow{ background:rgba(245,158,11,.14); border-left-color:var(--yellow); }
    .banner.purple{ background:rgba(139,92,246,.12); border-left-color:var(--purple); }
    .textBlock{ font-size:15px; line-height:1.6; margin:10px 0; font-weight:500; }
    .btnGrid{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
    button.chip{
      border:none; padding:10px 12px; font-weight:800; font-size:14px; color:#fff; cursor:pointer; box-shadow:var(--shadow2);
      border-radius:10px; text-align:left; max-width:100%;
    }
    .chip.green{ background:var(--greenBg); }
    .chip.red{ background:var(--redBg); }
    .chip.gray{ background:var(--grayBg); }
    .chip.blue{ background:var(--blue); }
    .chip.purple{ background:var(--purple); }
    .chip.active{ outline:4px solid rgba(14,165,233,.18); }
    .chip.long{ flex:1 1 520px; }

    .productRibbonHint{ margin:0 0 10px 0; font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    .productRibbonWrap{ border:1px solid var(--border); background:#fbfdff; box-shadow:var(--shadow2); padding:12px; overflow:hidden; }
    .productRibbon{ display:flex; flex-wrap:nowrap; gap:12px; overflow-x:auto; padding-bottom:4px; scroll-snap-type:x proximity; }
    .productSegment{ flex:0 0 auto; min-width:max-content; border:1px solid var(--border); background:#fff; border-radius:10px; padding:10px; box-shadow:var(--shadow2); scroll-snap-align:start; }
    .productSegmentTitle{ margin:0 0 8px 0; font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); white-space:nowrap; }
    .productLine{ display:flex; flex-wrap:nowrap; gap:8px; margin-top:0; overflow-x:auto; padding-bottom:2px; }
    .productLine .chip{ flex:0 0 auto; white-space:nowrap; font-size:12px; padding:8px 10px; border-radius:8px; }
    .objSwitchboard{ border:1px solid var(--border); background:#fff; box-shadow:var(--shadow2); padding:12px; margin:12px 0; }
    .objWorkspace{ display:grid; grid-template-columns:220px minmax(0,1fr); gap:12px; align-items:start; }
    .objTabs{ display:flex; flex-direction:column; gap:8px; margin:0; position:sticky; top:12px; align-self:start; }
    .objTab{
      width:100%; text-align:left;
      border:1px solid var(--border); background:#fff; color:#0f172a; border-radius:10px; padding:10px 12px; cursor:pointer;
      font-weight:900; font-size:12px; text-transform:uppercase; letter-spacing:.03em;
    }
    .objTab.active{ background:var(--blue); color:#fff; border-color:var(--blue2); box-shadow:var(--shadow2); }
    .objPanels{ min-width:0; }
    .objPanel{ border:1px solid var(--border); background:#fff; box-shadow:var(--shadow2); padding:14px; }
    .objPanelTitle{ margin:0 0 10px 0; font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    .objPanel .btnGrid{ gap:8px; margin-top:0; }
    .objPanel .chip{ flex:1 1 260px; padding:9px 11px; font-size:13px; }
    .objEmpty{ display:none; margin-top:8px; padding:10px 12px; border:1px dashed var(--border); border-radius:8px; background:#fafbfd; color:var(--muted); font-weight:700; }

    .cityListRed{ color:#dc2626; font-weight:900; }
    .priceTableWrap{ border:1px solid var(--border); background:#fff; box-shadow:var(--shadow2); padding:12px; margin:12px 0; border-radius:10px; }
    .priceTableTitle{ margin:0 0 8px 0; font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    .priceTable{ width:100%; border-collapse:collapse; font-size:12px; background:#fff; }
    .priceTable th, .priceTable td{ border:1px solid var(--border); padding:8px 10px; text-align:left; vertical-align:top; }
    .priceTable th{ background:#f8fafc; font-weight:900; text-transform:uppercase; letter-spacing:.03em; font-size:11px; }
    .priceAttention{ margin-top:10px; padding:10px 12px; border:1px solid rgba(220,38,38,.22); background:rgba(220,38,38,.06); border-radius:8px; font-size:12px; font-weight:800; line-height:1.5; }

    @media (max-width:900px){
      .objWorkspace{ grid-template-columns:1fr; }
      .objTabs{ position:static; flex-direction:row; flex-wrap:wrap; }
      .objTab{ width:auto; flex:1 1 180px; }
      .objPanel .chip{ flex:1 1 100%; }
    }
    @media (max-width:1100px){ .app{ grid-template-columns:1fr; } .sidebar{ position:relative; height:auto; } }
  </style>
</head>
<body>
<div class="app">
  <div class="main">
    <div class="page">
      <h1 class="pageTitle" id="pageTitle">ПРИВЕТСТВИЕ</h1>

      <div class="stageBar">
        <div class="stageLeft">
          <button class="navBtn" id="btnPrev">← Назад</button>
          <button class="navBtn blue" id="btnNext">Далее →</button>
        </div>
        <div class="stageRight">
          <button class="navBtn outline" id="btnLang">RU → KZ</button>
          <div class="stagePills" id="stagePills"></div>
        </div>
      </div>

      <div id="quickArea"></div>

      <div class="replicaBox" id="replicaBox">
        <div class="replicaHead">
          <div class="label" id="replicaLabel">Реплика (читать оператору)</div>
          <div class="meta" id="replicaMeta">Нажмите кнопку — реплика появится здесь</div>
          <div class="price" id="pricePill"></div>
        </div>
        <img id="replicaImg" alt="Фото товара" style="display:none; width:100%; max-height:220px; object-fit:contain; border:1px solid var(--border); background:#fff; margin:10px 0; padding:6px;" />
        <div class="replicaText" id="replicaText">—</div>
      </div>

      <div id="sectionContent"></div>
    </div>
  </div>

  <aside class="sidebar">
    <div class="sbTop">
      <div class="sbTitle" id="sbTitle">Скрипт • меню</div>
      <div class="inputs">
        <div class="field">
          <label id="lblClient">Имя клиента</label>
          <input id="clientName" placeholder="Напр.: Айгуль" />
        </div>
        <div class="field">
          <label id="lblOp">Имя оператора</label>
          <input id="opName" placeholder="Напр.: Алина" />
        </div>
      </div>
    </div>
    <div class="searchWrap">
      <input id="search" placeholder="Поиск по кнопкам..." />
    </div>
    <div class="menu" id="menu"></div>
  </aside>
</div>

<script>
  const PRICING = { base: 44000, benefit: 10000, final: 34000 };
  const fmt = (n)=> new Intl.NumberFormat('ru-RU').format(n);

  const UI = {
    ru: {
      appMenu:'Скрипт • меню', clientLabel:'Имя клиента', opLabel:'Имя оператора', clientPh:'Напр.: Айгуль', opPh:'Напр.: Алина',
      searchPh:'Поиск по кнопкам...', prev:'← Назад', next:'Далее →', langBtn:'RU → KZ', langBtnBack:'KZ → RU',
      replicaLabel:'Реплика (читать оператору)', replicaHint:'Нажмите кнопку — реплика появится здесь',

      appMenu:'Скрипт • мәзір', clientLabel:'Клиенттің аты', opLabel:'Оператордың аты-жөні', clientPh:'Мыс.: Айгүл', opPh:'Мыс.: Алина',
      searchPh:'Батырмалар бойынша іздеу...', prev:'← Артқа', next:'Келесі →', langBtn:'KZ → RU', langBtnBack:'RU → KZ',
      replicaLabel:'Сөйлем (оператор оқиды)', replicaHint:'Батырманы басыңыз — мәтін осында шығады',
      pricePill:(base, benefit, final)=>`Баға: ${fmt(base)} ₸ • Жеңілдік: ${fmt(benefit)} ₸ • Қорытынды: ${fmt(final)} ₸`
    }

  const TEXT = {
    ru: {
      hello_start:`Добрый день, это {Имя клиента}?

Это {Имя оператора}, Приятно очень. Это (Имя Отчество оператора), старший эксперт центра "Здоровье +".

      needs_if_ok:`Если клиент говорит «у меня всё хорошо»: {Имя клиента}, как раз поэтому я Вам и звоню. Лично на Ваше имя уже одобрена льготная программа “Здоровая нация” - и под мою личную ответственность она включает восстановление сосудов, ЖКТ, зрения, суставов, безопасное похудение (Если мужчина - и даже мужского здоровья).

      needs_hard_refusal:`Если категорически отказывается: {Имя клиента}, понимаю. замечательно, что на сегодняшний день у Вас нет жалоб по здоровью - это действительно редкость, и я искренне рад(а) это слышать! Как раз по этой причине и звоню - Вам уже одобрена льготная программа, и сейчас как раз есть возможность поддержать организм заранее, чтобы в будущем не столкнуться с неприятностями. Согласитесь, в наше время не так просто попасть под льготы, правда? `,

Вы же хотите решить свою проблему? (ждём ответ)

Имя клиента, уделите мне буквально несколько минут, и я подберу индивидуальную дозировку, расскажу подробнее и обязательно дам важные рекомендации, которые Вы не услышите даже от опытных врачей. Хорошо? (ждём ответ)`,
      health_2min:`{Имя клиента}, уделите мне буквально пару минут, и я подберу вариант под Вашу ситуацию.`,
      price_offer:`{Имя клиента}, стандартная стоимость курса {Цена}. По Вашей льготе списываем {Льгота}, и к оплате получается {Итог}. Доставка бесплатная, предоплаты нет — оплата только при получении. Закрепляем льготу?`,
      price_address:`Подскажите, пожалуйста, по какому адресу оформим доставку?`,
      checkout_summary:`Имя клиента, давайте коротко подытожим заказ. Вы выбрали: (укажите товар / набор), срок применения: (если применимо), количество упаковок: (укажите), итоговая сумма к оплате при получении: (укажите) тенге. Адрес доставки: (укажите), получатель: (сверьте ФИО). Обязательно ещё раз сверьте способ доставки, адрес и контактные данные.

      buyout:`Говорим спокойно и с заботой: посылка будет надежно упакована, без лишних внешних отметок. Внутри будет контакт для обратной связи, чтобы клиент мог быстро уточнить любой вопрос по заказу.

Для клиентов, которые получают заказ без задержек, у нас обычно действуют более выгодные условия на повторное обращение. При следующем заказе можно дополнительно уточнить доступную скидку или бонус.`

      hello_start:`Сәлеметсіз бе, бұл {Имя клиента} ма?

      needs_general:`1) {Имя клиента}, қазір жалпы жағдайыңыз қалай? Нені көбірек сезіп жүрсіз?

          { label:'Закажу позже', label_kz:'Кейін тапсырамын', color:'red', text:CUSTOM_OBJECTIONS.silent_order_later },
          { label:'Я вам перезвоню', label_kz:'Мен қайта қоңырау шаламын', color:'red', text:CUSTOM_OBJECTIONS.silent_call_me },
          { label:'Отдайте другому акцию', label_kz:'Акцияны басқаға беріңіз', color:'red', text:CUSTOM_OBJECTIONS.silent_give_to_other },
          { label:'Куплю позже / перезвоните', label_kz:'Кейін аламын / қайта қоңырау шалыңыз', color:'red', text:CUSTOM_OBJECTIONS.silent_later_callback }
        ],
        objNegative:[
          { label:'Покупал ранее, не помогло', label_kz:'Бұрын алғанмын, көмектеспеді', color:'red', text:CUSTOM_OBJECTIONS.negative_bought_before },
          { label:'Негативные отзывы', label_kz:'Жағымсыз пікірлер', color:'red', text:CUSTOM_OBJECTIONS.negative_reviews },
          { label:'Если не поможет', label_kz:'Көмектеспесе', color:'red', text:CUSTOM_OBJECTIONS.negative_not_help }
        ],
        objAssortment:[
          { label:'А какие ещё товары есть?', label_kz:'Тағы қандай тауар бар?', color:'red', text:CUSTOM_OBJECTIONS.assortment_more },
          { label:'Покажите каталог', label_kz:'Каталогты көрсетіңіз', color:'red', text:CUSTOM_OBJECTIONS.assortment_catalog }
        ],
        objPensioners:[
          { label:'Я пенсионер, нет денег', label_kz:'Мен зейнеткермін, ақшам жоқ', color:'red', text:CUSTOM_OBJECTIONS.pensioner_no_money },
          { label:'Пенсия маленькая', label_kz:'Зейнетақы аз', color:'red', text:CUSTOM_OBJECTIONS.pension_small }
        ]
      }
    }
  ];

  const FLOW = SECTIONS.map(s=>s.id);

  const menuEl = document.getElementById('menu');
  const pageTitleEl = document.getElementById('pageTitle');
  const sectionContentEl = document.getElementById('sectionContent');
  const replicaTextEl = document.getElementById('replicaText');
  const replicaMetaEl = document.getElementById('replicaMeta');
  const pricePillEl = document.getElementById('pricePill');
  const stagePillsEl = document.getElementById('stagePills');
  const quickAreaEl = document.getElementById('quickArea');
  const btnPrevEl = document.getElementById('btnPrev');
  const btnNextEl = document.getElementById('btnNext');
  const btnLangEl = document.getElementById('btnLang');
  const sbTitleEl = document.getElementById('sbTitle');
  const lblClientEl = document.getElementById('lblClient');
  const lblOpEl = document.getElementById('lblOp');
  const replicaLabelEl = document.getElementById('replicaLabel');
  const replicaImgEl = document.getElementById('replicaImg');

  function ui(key, ...args){
    const pack = UI[state.lang] || UI.ru;
    const val = (pack && pack[key] !== undefined) ? pack[key] : UI.ru[key];
    return typeof val === 'function' ? val(...args) : val;
  }

  function sectionTitle(s){
    return state.lang === 'kz' ? (s.title_kz || s.title_ru) : (s.title_ru || s.title_kz);
  }

  function localizedText(v){
    if (typeof v === 'string') return v;
    if (v && typeof v === 'object') return v[state.lang] || v.ru || v.kz || '';
    return '';
  }

  function localizedLabel(v){
    return state.lang === 'kz' ? (v.label_kz || v.label) : (v.label || v.label_kz);
  }

  function tokens(){
    const isKz = state.lang === 'kz';
    const moneyWord = isKz ? 'теңге' : 'тенге';
    return {
      client: document.getElementById('clientName').value.trim() || (isKz ? 'Клиент' : 'Имя клиента'),
      op: document.getElementById('opName').value.trim() || (isKz ? 'Оператор' : 'Имя оператора'),
      priceBase: `${fmt(PRICING.base)} ${moneyWord}`,
      benefit: `${fmt(PRICING.benefit)} ${moneyWord}`,
      priceFinal: `${fmt(PRICING.final)} ${moneyWord}`
    };
  }

  function escapeHtml(str){
    return (str ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'", '&#039;');
  }

  function applyTokensToReplicaHtml(text){
    const t = tokens();
    let s = (text || '')
      .replaceAll('{Имя клиента}', '[[CLIENT]]')
      .replaceAll('{Имя оператора}', '[[OP]]')
      .replaceAll('{Цена}', '[[PRICE_BASE]]')
      .replaceAll('{Льгота}', '[[BENEFIT]]')
      .replaceAll('{Итог}', '[[PRICE_FINAL]]');

    s = escapeHtml(s)
      .replaceAll('[[CLIENT]]', `<span class="tokenClient">${escapeHtml(t.client)}</span>`)
      .replaceAll('[[OP]]', escapeHtml(t.op))
      .replaceAll('[[PRICE_BASE]]', escapeHtml(t.priceBase))
      .replaceAll('[[BENEFIT]]', escapeHtml(t.benefit))
      .replaceAll('[[PRICE_FINAL]]', escapeHtml(t.priceFinal));

    return s.replaceAll('\n','<br>');
  }

  function currentSection(){
    return SECTIONS.find(s => s.id === state.sectionId) || SECTIONS[0];
  }


  function setReplicaImage(url){
    if (!replicaImgEl) return;
    const u = (url || '').trim();
    if (!u){ replicaImgEl.style.display='none'; replicaImgEl.removeAttribute('src'); return; }
    replicaImgEl.src = u;
    replicaImgEl.style.display='block';
  }

  function setDefaultPricePill(){
    pricePillEl.textContent = ui('pricePill', PRICING.base, PRICING.benefit, PRICING.final);
  }

  function setReplica(sectionTitleText, btnLabelText, text){
    setReplicaImage('');
    replicaMetaEl.textContent = `${sectionTitleText} → ${btnLabelText}`;
    replicaTextEl.innerHTML = applyTokensToReplicaHtml(text);
  }

  function matchesSearch(hay){
    const q = state.search.trim().toLowerCase();
    if (!q) return true;
    return (hay || '').toLowerCase().includes(q);
  }

  function goToSection(id){
    if (!FLOW.includes(id)) return;
    state.sectionId = id;
    state.activeKey = null;
    render();
  }

  function renderTopUI(){
    document.documentElement.lang = state.lang === 'kz' ? 'kk' : 'ru';
    sbTitleEl.textContent = ui('appMenu');
    lblClientEl.textContent = ui('clientLabel');
    lblOpEl.textContent = ui('opLabel');
    document.getElementById('clientName').placeholder = ui('clientPh');
    document.getElementById('opName').placeholder = ui('opPh');
    document.getElementById('search').placeholder = ui('searchPh');
    btnPrevEl.textContent = ui('prev');
    btnNextEl.textContent = ui('next');
    btnLangEl.textContent = state.lang === 'ru' ? ui('langBtn') : ui('langBtnBack');
    replicaLabelEl.textContent = ui('replicaLabel');
    if (!state.activeKey) replicaMetaEl.textContent = ui('replicaHint');
    setDefaultPricePill();
  }

  function renderStagePills(){
    stagePillsEl.innerHTML = '';
    SECTIONS.forEach(s => {
      const b = document.createElement('button');
      b.className = `stagePill ${s.id === state.sectionId ? 'active' : ''}`;
      b.textContent = sectionTitle(s);
      b.onclick = () => goToSection(s.id);
      stagePillsEl.appendChild(b);
    });
  }

  function renderMenu(){
    menuEl.innerHTML = '';
    SECTIONS.forEach(s => {
      const a = document.createElement('a');
      a.href = '#';
      a.textContent = sectionTitle(s);
      if (s.id === state.sectionId) a.classList.add('active');
      a.onclick = (e) => { e.preventDefault(); goToSection(s.id); };
      menuEl.appendChild(a);

      if (s.id === 'products') {
        PRODUCTS.forEach(group => {
          const cat = document.createElement('div');
          cat.className = 'cat';
          cat.textContent = state.lang === 'kz' ? group.cat_kz : group.cat;
          menuEl.appendChild(cat);

          group.items.forEach(item => {
            const sub = document.createElement('a');
            sub.href = '#';
            sub.className = 'sub';
            sub.textContent = state.lang === 'kz' ? item.label_kz : item.label;
            sub.onclick = (e) => {
              e.preventDefault();
              state.sectionId = 'products';
              state.activeKey = `product||${item.label}`;
              render();
              setReplica(sectionTitle(currentSection()), sub.textContent, localizedText(item.text));
            };
            menuEl.appendChild(sub);
          });
        });
      }
    });
  }

  function renderProductsRibbon(){
    const ribbon = sectionContentEl.querySelector('#productRibbon');
    if (!ribbon) return;
    ribbon.innerHTML = '';

    PRODUCTS.forEach(group => {
      const seg = document.createElement('div');
      seg.className = 'productSegment';
      seg.innerHTML = `<div class="productSegmentTitle">${escapeHtml(state.lang === 'kz' ? group.cat_kz : group.cat)}</div><div class="btnGrid productLine"></div>`;
      const line = seg.querySelector('.productLine');

      group.items.filter(item => matchesSearch(`${item.label} ${localizedText(item.text)}`)).forEach(item => {
        const btn = document.createElement('button');
        btn.className = `chip ${item.color || 'gray'}`;
        btn.textContent = state.lang === 'kz' ? item.label_kz : item.label;
        btn.onclick = () => {
          state.activeKey = `product||${item.label}`;
          setReplica(sectionTitle(currentSection()), btn.textContent, localizedText(item.text));
        };
        line.appendChild(btn);
      });

      ribbon.appendChild(seg);
    });
  }


  function buildPricePromoTableHtml(lang='ru'){
    const isKz = lang === 'kz';
    const titleProduct = isKz ? 'Өнім атауы' : 'Название продукта';
    const titlePromo = 'Акция';
    const titlePrice = isKz ? 'Баға' : 'Цена';
    const titleCondition = isKz ? 'Шарт' : 'Условие';
    const promoTableTitle = isKz ? 'Жаңа тауарлар (акциялар)' : 'Новые товары (акции)';
    const standardTableTitle = isKz ? 'Стандартты тауарлар' : 'Стандартные товары';
    const promoRows = PRODUCTS
      .flatMap(group => group.items.filter(item => item.isPromo))
      .map(item => `<tr><td>${escapeHtml(isKz ? (item.label_kz || item.label) : item.label)}</td><td>${escapeHtml(item.tablePromo || '')}</td><td>${escapeHtml(item.tablePrice || '')}</td></tr>`)
      .join('');
    const standardRows = PRODUCTS
      .flatMap(group => group.items.filter(item => !item.isPromo && group.cat !== 'ПОДАРОК НА ПОЧТУ'))
      .map(item => `<tr><td>${escapeHtml(isKz ? (item.label_kz || item.label) : item.label)}</td><td>${escapeHtml(item.tableCondition || 'Стандартная льгота')}</td><td>${escapeHtml(item.tablePrice || '')}</td></tr>`)
      .join('');
    const promoAttention = isKz
      ? `Жаңа тауарлар үшін курьер тек мына қалаларға жеткізеді — <span class="cityListRed">Актау, Алматы, Кокшетау, Туркестан, Шымкент, Астана</span>. Пошта — Қазақстан бойынша.`
      : `Для новых товаров обязательно проверяйте доставку: курьерская доставка доступна только по городам — <span class="cityListRed">Актау, Алматы, Кокшетау, Туркестан, Шымкент, Астана</span>. Почтовая доставка доступна по всему Казахстану.`;
    const standardAttention = isKz
      ? `Стандартты тауарлар үшін базалық схема қолданылады: баға 44 000 ₸, жеңілдік 10 000 ₸, қорытынды 34 000 ₸.`
      : `Для стандартных товаров действует базовая схема: цена 44 000 ₸, льгота 10 000 ₸, итог 34 000 ₸.`;
    return `
      <div class="priceTableWrap">
        <div class="priceTableTitle">${promoTableTitle}</div>
        <table class="priceTable">
          <thead><tr><th>${titleProduct}</th><th>${titlePromo}</th><th>${titlePrice}</th></tr></thead>
          <tbody>${promoRows}</tbody>
        </table>
        <div class="priceAttention">${promoAttention}</div>
      </div>
      <div class="priceTableWrap">
        <div class="priceTableTitle">${standardTableTitle}</div>
        <table class="priceTable">
          <thead><tr><th>${titleProduct}</th><th>${titleCondition}</th><th>${titlePrice}</th></tr></thead>
          <tbody>${standardRows}</tbody>
        </table>
        <div class="priceAttention">${standardAttention}</div>
      </div>`;
  }

  function syncObjCategoryUI(section){
    if (!section || section.id !== 'objAfterPrice') return;

    const catMap = {
      cost:'objCost', doubts:'objDoubts', scam:'objScam', safety:'objSafety',
      silent:'objSilent', negative:'objNegative', assortment:'objAssortment', pensioners:'objPensioners'
    };

    sectionContentEl.querySelectorAll('[data-objcat]').forEach(tab => {
      const cat = tab.getAttribute('data-objcat');
      tab.classList.toggle('active', cat === state.objCategory);
      tab.onclick = () => {
        state.objCategory = cat;
        state.activeKey = null;
        renderSection();
      };
    });

    sectionContentEl.querySelectorAll('[data-objpanel]').forEach(panel => {
      panel.style.display = panel.getAttribute('data-objpanel') === state.objCategory ? '' : 'none';
    });

    sectionContentEl.querySelectorAll('[data-empty-for]').forEach(empty => {
      const gridName = empty.getAttribute('data-empty-for');
      const grid = sectionContentEl.querySelector(`[data-grid="${gridName}"]`);
      const visible = catMap[state.objCategory] === gridName && grid && !grid.children.length;
      empty.style.display = visible ? 'block' : 'none';
    });
  }

  function renderSection(){
    const s = currentSection();
    pageTitleEl.textContent = sectionTitle(s);
    quickAreaEl.innerHTML = '';
    sectionContentEl.innerHTML = localizedText(s.contentHtml);

    if (s.id === 'products') {
      renderProductsRibbon();
    }
    if (s.id === 'price') {
      const priceMount = sectionContentEl.querySelector('#priceTablesMount');
      if (priceMount) priceMount.innerHTML = buildPricePromoTableHtml(state.lang);
    }

    const grids = [...sectionContentEl.querySelectorAll('[data-grid]')];
    grids.forEach(gridEl => {
      const gridName = gridEl.getAttribute('data-grid');
      const list = (s.buttonsByGrid && s.buttonsByGrid[gridName]) ? s.buttonsByGrid[gridName] : [];
      gridEl.innerHTML = '';
      list
        .filter(btn => matchesSearch(`${localizedLabel(btn)} ${localizedText(btn.text)}`))
        .forEach((btn, idx) => {
          const display = (s.id === 'objAfterPrice' && gridName.startsWith('obj')) ? `${idx + 1}. ${localizedLabel(btn)}` : localizedLabel(btn);
          const b = document.createElement('button');
          b.className = `chip ${btn.color || 'gray'} ${display.length > 50 ? 'long' : ''}`;
          b.textContent = display;
          b.onclick = () => {
            state.activeKey = `${s.id}||${gridName}||${btn.label}`;
            setReplica(sectionTitle(s), display, localizedText(btn.text));
            if (btn.goto) goToSection(btn.goto);
          };
          gridEl.appendChild(b);
        });
    });

    syncObjCategoryUI(s);

    if (!state.activeKey) {
      if (s.id === 'products') {
        const firstGroup = PRODUCTS.find(g => g.items.length);
        if (firstGroup) {
          const firstItem = firstGroup.items[0];
          setReplica(sectionTitle(s), state.lang === 'kz' ? firstItem.label_kz : firstItem.label, localizedText(firstItem.text));
          state.activeKey = `product||${firstItem.label}`;
        } else {
          replicaTextEl.textContent = '—';
        }
      } else {
        const allButtons = Object.values(s.buttonsByGrid || {}).flat();
        const first = allButtons.find(btn => matchesSearch(`${localizedLabel(btn)} ${localizedText(btn.text)}`));
        if (first) {
          const display = localizedLabel(first);
          setReplica(sectionTitle(s), display, localizedText(first.text));
          state.activeKey = `${s.id}||auto||${first.label}`;
        } else {
          replicaMetaEl.textContent = `${sectionTitle(s)} → ${ui('replicaHint')}`;
          replicaTextEl.textContent = '—';
        }
      }
    }
  }

  function bindPrevNext(){
    const idx = FLOW.indexOf(state.sectionId);
    btnPrevEl.disabled = idx <= 0;
    btnNextEl.disabled = idx >= FLOW.length - 1;
    btnPrevEl.onclick = () => { if (idx > 0) goToSection(FLOW[idx - 1]); };
    btnNextEl.onclick = () => { if (idx < FLOW.length - 1) goToSection(FLOW[idx + 1]); };
  }

  function render(){
    renderTopUI();
    renderStagePills();
    renderMenu();
    renderSection();
    bindPrevNext();
  }

  document.getElementById('clientName').addEventListener('input', renderSection);
  document.getElementById('opName').addEventListener('input', renderSection);
  document.getElementById('search').addEventListener('input', (e) => {
    state.search = e.target.value;
    state.activeKey = null;
    renderSection();
  });
  btnLangEl.addEventListener('click', () => {
    state.lang = state.lang === 'ru' ? 'kz' : 'ru';
    state.activeKey = null;
    render();
  });

  render();
</script>
</body>
</html>
